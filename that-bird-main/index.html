<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cybersecurity Blueprints — Splash → App</title>

  <!-- Fonts & Tailwind (matches your site) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Architects+Daughter&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root{
      --splash-total: 5s;        /* total splash time */
      --breaths: 2;              /* inhale/exhale cycles */
      --grid-blue:#0D47A1;
      --grid-line-strong:#ffffff1a;
      --grid-line-fine:#ffffff0d;
    }

    html,body{height:100%;margin:0}

    /* App background (revealed after splash) */
    body{
      background:
        linear-gradient(var(--grid-line-strong) 1px, transparent 1px) 0 0 / 40px 40px,
        linear-gradient(90deg, var(--grid-line-strong) 1px, transparent 1px) 0 0 / 40px 40px,
        linear-gradient(var(--grid-line-fine) 1px, transparent 1px) 0 0 / 8px 8px,
        linear-gradient(90deg, var(--grid-line-fine) 1px, transparent 1px) 0 0 / 8px 8px;
      background-color: var(--grid-blue);
      display:block;
      overflow:hidden; /* locked during splash */
    }

    /* ===== SPLASH ===== */
    .splash{ position:fixed; inset:0; z-index:9999; display:grid; place-items:center; background:#000; }
    .logo-wrap{ position:relative; width:min(72vmin, 540px); aspect-ratio:1/1; display:grid; place-items:center; }
    .logo{ width:100%; height:100%; object-fit:contain; filter: drop-shadow(0 0 14px #000);
      animation: breathe calc(var(--splash-total)/var(--breaths)) ease-in-out var(--breaths) both; }

    /* Neon sweep is masked by the bird silhouette — only the bird glows.
       Bright, intense colours; clockwise sweep; rest stays dark. */
    .neon{
      position:absolute; inset:0; pointer-events:none;
      background:
        conic-gradient(
          from 0deg,
          #00fff2 0deg, #36f3ff 30deg, #7ef6ff 60deg, #aafc5a 120deg,
          #ffd37e 180deg, #ff8b7e 210deg, #ff7ef6 260deg, #b07eff 300deg, #00e5ff 340deg, #00fff2 360deg
        );
      /* Mask to the logo silhouette so the glow traces the actual bird/shield. */
      -webkit-mask-image: url("https://coachpete86.github.io/that-bird/image/bird.png");
              mask-image: url("https://coachpete86.github.io/that-bird/image/bird.png");
      -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
      -webkit-mask-position:center;  mask-position:center;
      -webkit-mask-size:contain;      mask-size:contain;

      /* Make it read like a hot edge: soften + screen blend over black */
      filter: blur(12px) brightness(1.5) saturate(1.4);
      mix-blend-mode: screen;
      opacity:.95;

      /* Clockwise sweep runs twice over total 5s (2.5s per pass) */
      animation: neonSweep calc(var(--splash-total)/var(--breaths)) linear var(--breaths) both;
    }

    /* slim progress bar */
    .load{ position:absolute; bottom:clamp(18px,6vh,64px); width:min(64vmin, 460px); height:10px;
      border-radius:999px; overflow:hidden; background:#0b0b0b; box-shadow:0 0 0 1px #1affff55 inset, 0 0 18px #00fff280; }
    .fill{ height:100%; width:0%; background: linear-gradient(90deg, #00fff2, #36f3ff, #8a9eff);
      box-shadow: 0 0 12px #36f3ff;
      animation: loadbar var(--splash-total) linear forwards; }

    /* Reveal app after splash ends */
    .content{ opacity:0; transform:translateY(8px); transition: opacity .6s ease .2s, transform .6s ease .2s; }
    .content.is-live{ opacity:1; transform:none; }
    body.blueprint{ font-family:'Kalam', cursive;
      background-color:#1a3a6a;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
      background-size:2rem 2rem;
      color:#ffffff;
      overflow:auto; /* unlock scroll */
    }

    @keyframes breathe{
      0%,100%{ transform:scale(1) }
      50%{ transform:scale(1.085) }
    }
    @keyframes neonSweep{
      from{ transform: rotate(0deg) scale(1.01); }
      to  { transform: rotate(360deg) scale(1.01); }
    }
    @keyframes loadbar{ to{ width:100%; } }

    @media (prefers-reduced-motion: reduce){
      .logo{ animation: none }
      .neon{ animation: none; opacity:.75 }
      .fill{ animation-duration:.01s }
    }

    /* ===== APP UI (same look as your site) ===== */
    .sketch-border{ border:2px solid rgba(255,255,255,.8); box-shadow:2px 2px 0 rgba(255,255,255,.5); transition:.2s }
    .sketch-border:hover{ transform:translate(-2px,-2px); box-shadow:4px 4px 0 rgba(255,255,255,.5) }
    .sketch-font{ font-family:'Architects Daughter', cursive }
    .diagram-text{ font-family:'Architects Daughter', cursive; font-size:10px; fill:#fff; text-anchor:middle }
    .section-title{ font-family:'Architects Daughter', cursive; font-weight:700; color:#a7f3d0 }

    /* Layout */
    .grid-app{ display:grid; grid-template-columns: 380px 1fr; gap:1.25rem }
    @media (max-width:1024px){ .grid-app{ grid-template-columns: 1fr } }
    .left-col{ max-height:calc(100vh - 6rem); overflow:hidden }
    .right-col{ max-height:calc(100vh - 6rem); overflow:auto }

    /* Chips & A–Z */
    .chip{ padding:.25rem .6rem; border:1px solid #ffffff66; border-radius:999px; cursor:pointer; user-select:none }
    .chip[data-active="true"]{ background:#ffffff22 }
    .az button{ width:1.8rem; text-align:center; opacity:.85; border:1px solid #ffffff22; border-radius:.25rem; padding:.15rem 0 }
    .az button:hover{ opacity:1; background:#ffffff10 }

    /* Virtual list */
    #results{ height: calc(100vh - 22rem); overflow:auto }
    .vr-inner{ position:relative; width:100%; height:0 }
    .vr-row{ position:absolute; left:0; right:0; padding:.65rem .75rem; border-radius:.5rem; cursor:pointer }
    .vr-row:hover{ background:#ffffff12 }
    .vr-row[aria-selected="true"]{ background:#ffffff22 }
    .vr-head{ position:absolute; left:0; right:0; padding:.35rem .75rem; font-weight:700; color:#a7f3d0; opacity:.9 }
    mark{ background:#a7f3d0; color:#113; padding:0 .15em; border-radius:.15rem }

    /* Switcher */
    .switch button{ border:1px solid #ffffff44; padding:.35rem .65rem; border-radius:.5rem }
    .switch button[data-active="true"]{ background:#ffffff1f }

    /* Command palette */
    .cmd{ position:fixed; inset:0; display:none; align-items:flex-start; justify-content:center; background:#0008; z-index:50 }
    .cmd.is-open{ display:flex }
    .cmd-panel{ margin-top:8vh; width:min(820px,95vw); border:2px solid #fff; background:#103b73; border-radius:.75rem; overflow:hidden }
    .cmd-panel input{ width:100%; padding:14px 16px; background:#0c2e5a; color:#fff; outline:none }
    .cmd-list{ max-height:60vh; overflow:auto }
    .cmd-item{ padding:.6rem .9rem; border-top:1px solid #ffffff22; cursor:pointer }
    .cmd-item:hover{ background:#ffffff14 }

    /* Compare tray */
    .tray{ position:fixed; left:50%; transform:translateX(-50%); bottom:16px; background:#0c2e5a; border:1px solid #ffffff55; border-radius:.75rem; padding:.4rem .6rem; display:flex; gap:.5rem; align-items:center; z-index:20 }
    .pill{ border:1px solid #ffffff66; padding:.1rem .4rem; border-radius:.5rem; font-size:.85rem }

    /* Map canvas */
    #mapWrap{ display:none }
    #mapWrap[data-active="true"]{ display:block }
    #mapCanvas{ width:100%; height:70vh; background:#001733; border:2px solid #fff; border-radius:.75rem }
    .legend{ display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.5rem }
    .legend .lg{ display:flex; align-items:center; gap:.4rem; font-size:.9rem }
    .legend .sw{ width:12px; height:12px; border-radius:2px; border:1px solid #fff }

    /* Cards */
    #cardsWrap{ display:none }
    #cardsWrap[data-active="true"]{ display:block }
    .card{ width:min(900px,95vw); min-height:360px; margin:0 auto; background:#0e2b57; border:2px solid #fff; border-radius:1rem; padding:1.25rem }
    .face{ font-size:2rem; text-align:center; padding:1rem }
    .controls{ display:flex; gap:.5rem; justify-content:center; margin-top:.75rem }
    .rbtn{ border:1px solid #fff; padding:.4rem .6rem; border-radius:.5rem }

    /* Bottom mobile switcher */
    .mobile-switch{ position:fixed; bottom:0; left:0; right:0; background:#0c2e5a; border-top:1px solid #ffffff44; display:none; z-index:30 }
    .mobile-switch button{ flex:1; padding:.7rem 0; border-right:1px solid #ffffff22 }
    @media (max-width:1024px){ .mobile-switch{ display:flex } }
  </style>
</head>
<body class="antialiased">
  <!-- ===== SPLASH ===== -->
  <div class="splash" aria-hidden="true">
    <div class="logo-wrap">
      <img class="logo" alt="App emblem"
           src="https://coachpete86.github.io/that-bird/image/bird.png" />
      <div class="neon"></div>
    </div>
    <div class="load" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
      <div class="fill"></div>
    </div>
  </div>

  <!-- ===== APP ===== -->
  <main class="content" id="app" role="main">
    <div class="container mx-auto p-4 md:p-8">
      <!-- Header -->
      <header class="mb-4 flex flex-wrap items-center justify-between gap-3">
        <div>

        <nav class="switch flex gap-2" aria-label="Display mode">

          <button id="modeCards" title="Cards (C)">Cards</button>

      <!-- Tools -->
      <div class="mb-3 flex flex-wrap items-center gap-2">
        <button id="saveView" class="border border-white/60 rounded px-2 py-1">Save view</button>

          <option value="">Load saved view…</option>
        </select>
        <span class="text-sm text-gray-200 opacity-80">Press <strong>Ctrl/⌘+K</strong> to jump anywhere</span>

      <!-- LIST MODE -->
      <section id="listMode" data-active="true">
        <div class="grid-app">

          <aside class="left-col space-y-4" aria-label="Blueprint index">

            <div class="flex flex-wrap gap-2">
              <select id="fRisk" class="bg-transparent border border-white/40 rounded px-2 py-1">
                <option value="">Risk: Any</option>
                <option>Low</option><option>Medium</option><option>High</option>
              </select>
              <select id="fAudience" class="bg-transparent border border-white/40 rounded px-2 py-1">

                <option>Owner</option><option>Staff</option><option>IT</option>
              </select>
              <select id="fStatus" class="bg-transparent border border-white/40 rounded px-2 py-1">

                <option>Core</option><option>Advanced</option>
              </select>
            </div>
            <div class="az flex flex-wrap gap-1 text-sm" id="azBar" aria-label="Alphabet jump"></div>

            <div id="results" class="sketch-border rounded-lg overflow-auto p-1 relative" role="listbox" aria-label="Results">
              <div class="vr-inner" id="vrInner"></div>
            </div>
          </aside>

          <!-- Right: detail -->
          <section id="detail" class="right-col sketch-border rounded-lg p-6 min-h-[60vh]" aria-live="polite">
            <h2 id="dTitle" class="text-3xl md:text-4xl font-bold mb-2 sketch-font"></h2>
            <div id="dMeta" class="text-sm text-gray-200 mb-4"></div>
            <div id="dDiagram" class="my-4"></div>
            <p id="dExpl" class="text-lg leading-relaxed"></p>
            <div id="dImp" class="mt-6"></div>
            <div id="dDmg" class="mt-6"></div>
          </section>
        </div>

        <!-- Compare tray -->
        <div class="tray hidden" id="tray">
          <span class="text-sm opacity-80">Compare:</span>
          <div id="trayItems" class="flex gap-1"></div>
          <button id="openCompare" class="pill">Open</button>
          <button id="clearCompare" class="pill">Clear</button>
        </div>
      </section>

      <!-- MAP MODE -->
      <section id="mapWrap">
        <canvas id="mapCanvas"></canvas>
        <div class="legend" id="legend"></div>
        <p class="text-sm text-gray-200 mt-2">Scroll to zoom • Drag to pan • Click a node to open</p>
      </section>

      <!-- CARDS MODE -->
      <section id="cardsWrap">
        <div class="card sketch-border">
          <div class="face" id="cardFace">Loading…</div>
          <div class="controls">
            <button id="btnPrev" class="rbtn">⟵ Prev</button>
            <button id="btnFlip" class="rbtn">Flip (Space)</button>
            <button id="btnNext" class="rbtn">Next ⟶</button>
          </div>
          <div class="controls">
            <span class="text-sm opacity-80">Rate recall:</span>
            <button class="rbtn rate" data-v="1">1</button>
            <button class="rbtn rate" data-v="2">2</button>
            <button class="rbtn rate" data-v="3">3</button>
            <button class="rbtn rate" data-v="4">4</button>
            <button class="rbtn rate" data-v="5">5</button>

          <div class="mt-2 grid grid-cols-12 gap-1" id="heat"></div>
        </div>
      </section>
    </div>

    <!-- Mobile display switcher -->
    <div class="mobile-switch">
      <button id="mList">List</button>
      <button id="mMap">Map</button>
      <button id="mCards">Cards</button>
    </div>

    <!-- Command palette -->
    <div class="cmd" id="cmd">
      <div class="cmd-panel">
        <input id="cmdInput" placeholder="Type to search…" />
        <div class="cmd-list" id="cmdList"></div>
      </div>
    </div>
  </main>

  <script>
    /* ===== Reveal app when splash completes ===== */
    const splash = document.querySelector('.splash');
    const app = document.getElementById('app');

    setTimeout(() => {
      // fade splash out smoothly
      splash.style.transition = 'opacity .5s ease';
      splash.style.opacity = '0';
      setTimeout(() => {
        splash.remove();
        document.body.classList.add('blueprint');
        app.classList.add('is-live');
        document.body.style.overflow = 'auto';
      }, 520);
    }, 5000);

    // Progressbar ARIA
    (function(){
      const bar = document.querySelector('.load'); const started = performance.now(); const total = 5000;
      const tick = now => {
        const pct = Math.min(100, ((now - started)/total)*100);
        bar.setAttribute('aria-valuenow', pct.toFixed(0));
        if(pct<100) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    })();
  </script>

    const dExpl = document.getElementById('dExpl');
    const dImp = document.getElementById('dImp');
    const dDmg = document.getElementById('dDmg');

    const fRisk = document.getElementById('fRisk');
    const fAudience = document.getElementById('fAudience');
    const fStatus = document.getElementById('fStatus');

    const tray = document.getElementById('tray');
    const trayItems = document.getElementById('trayItems');

    const activeCats = new Set(categories);
    let filtered = [];
    let flat = []; let offsets=[]; let totalH=0; let letterTop=new Map(); let itemIndexToTop=[]; let selIndex=-1;

    const ROW_H = 68, HDR_H = 28, BUFFER_PX = 300;

    function escRE(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    function hilite(text, query){ if(!query) return text; const rx=new RegExp(`(${escRE(query)})`,'ig'); return text.replace(rx,'<mark>$1</mark>'); }

    function drawChips(){
      chips.innerHTML='';
      categories.forEach(cat=>{
        const b=document.createElement('button'); b.className='chip'; b.textContent=cat; b.dataset.active=activeCats.has(cat);
        b.onclick=()=>{ if(activeCats.has(cat)) activeCats.delete(cat); else activeCats.add(cat); b.dataset.active=activeCats.has(cat); applyFilter(); };
        chips.appendChild(b);
      });
      const tools=document.createElement('div'); tools.className='text-sm text-gray-200 opacity-80 flex gap-3';
      tools.innerHTML='<button class="underline" id="allOn">All</button><button class="underline" id="allOff">None</button>';
      chips.appendChild(tools);
      document.getElementById('allOn').onclick=()=>{ categories.forEach(c=>activeCats.add(c)); drawChips(); applyFilter(); };
      document.getElementById('allOff').onclick=()=>{ activeCats.clear(); drawChips(); applyFilter(); };
    }

    letters.forEach(ch=>{ const btn=document.createElement('button'); btn.textContent=ch; btn.onclick=()=>jumpToLetter(ch); azBar.appendChild(btn); });

    function synonymExpand(qv){ const hit=SYN.get(normalize(qv)); return hit? [qv, hit] : [qv]; }

    function applyFilter(){
      const text = q.value.trim();
      const queries = synonymExpand(text);
      const risk = fRisk.value; const audience = fAudience.value; const status = fStatus.value;

      filtered = master.filter(x=>{
        if(!activeCats.has(x.category)) return false;
        if(risk && x.riskLevel!==risk) return false;
        if(status && x.status!==status) return false;
        if(audience && !(x.audience||[]).includes(audience)) return false;
        if(!text) return true;
        const hay = [x.title,x.term,(x.tags||[]).join(' ')].join(' ');
        return queries.some(qr=> fuzzyScore(hay, qr) >= .75);
      }).sort((a,b)=> a.title.localeCompare(b.title));

      metaCount.textContent = `${filtered.length} result${filtered.length!==1?'s':''}`;
      buildFlat(); selIndex = filtered.length? 0 : -1; if(filtered.length) showDetail(filtered[0]); else showDetail(null);
      results.scrollTop=0; renderWindow();
      LS.set('lastFilters',{risk,audience,status,cats:[...activeCats], text});
    }

    function buildFlat(){
      flat=[]; offsets=[]; letterTop=new Map(); itemIndexToTop=[]; totalH=0; let current='';
      filtered.forEach((it,idx)=>{
        const L=(it.title||it.term||'').charAt(0).toUpperCase();
        if(L!==current){ current=L; flat.push({type:'header',letter:L}); offsets.push(totalH); letterTop.set(L,totalH); totalH+=HDR_H; }
        flat.push({type:'item', item:it, itemIndex:idx}); offsets.push(totalH); itemIndexToTop[idx]=totalH; totalH+=ROW_H;
      });
      inner.style.height=totalH+'px';
    }

    function lowerBound(arr, target){ let lo=0, hi=arr.length; while(lo<hi){ const mid=(lo+hi)>>1; if(arr[mid]<target) lo=mid+1; else hi=mid; } return lo; }

    function renderWindow(){
      const top=results.scrollTop - BUFFER_PX, bottom=results.scrollTop + results.clientHeight + BUFFER_PX;
      const first=lowerBound(offsets, Math.max(0,top)); let last=first; while(last<flat.length && offsets[last] < bottom) last++;
      inner.innerHTML='';
      for(let i=first;i<last;i++){
        const y=offsets[i], row=flat[i];
        if(row.type==='header'){
          const h=document.createElement('div'); h.className='vr-head'; h.style.transform=`translateY(${y}px)`; h.style.height='28px'; h.textContent=row.letter; inner.appendChild(h);
        }else{
          const it=row.item; const el=document.createElement('div'); el.className='vr-row'; el.style.transform=`translateY(${y}px)`; el.style.height='68px';
          el.setAttribute('aria-selected', row.itemIndex===selIndex ? 'true' : 'false');
          el.innerHTML = `<div class="flex items-center justify-between gap-2">
              <div>
                <div class="text-lg">${hilite(it.title, q.value)}</div>
                <div class="text-xs text-gray-300 opacity-80">${it.category} • Risk: ${it.riskLevel} • ${it.status}</div>
              </div>
              <button class="text-xs border border-white/50 rounded px-2 py-1 addCmp">Compare</button>
            </div>`;
          el.onclick = (ev)=>{
            if(ev.target.classList.contains('addCmp')){ toggleCompare(it); ev.stopPropagation(); return; }
            selIndex=row.itemIndex; showDetail(it); ensureVisible(selIndex); renderWindow();
          };
          inner.appendChild(el);
        }
      }
    }

    function showDetail(item){
      if(!item){ dTitle.textContent=''; dMeta.textContent=''; dDiagram.innerHTML=''; dExpl.textContent=''; dImp.innerHTML=''; dDmg.innerHTML=''; return; }
      dTitle.textContent=item.title; dMeta.textContent=`${item.category} • Risk: ${item.riskLevel} • Audience: ${(item.audience||[]).join(', ')||'All'} • ${item.status}`;
      dDiagram.innerHTML=item.diagram||''; dExpl.textContent=item.explanation;
      dImp.innerHTML = `<h3 class="text-2xl section-title mb-2">How This Affects You</h3><p class="text-lg md:text-xl">${item.importance}</p>`;
      dDmg.innerHTML = `<h3 class="text-2xl section-title mb-2 mt-4">Damage Example</h3><p class="text-lg md:text-xl">${item.damageExample}</p>`;
      history.replaceState(null,'',`#${encodeURIComponent(item.term)}`);
    }
    function ensureVisible(idx){ if(idx<0) return; const top=itemIndexToTop[idx], bot=top+68, vTop=results.scrollTop, vBot=vTop+results.clientHeight; if(top<vTop) results.scrollTop=top; else if(bot>vBot) results.scrollTop=bot-results.clientHeight; }
    function jumpToLetter(L){ const t=letterTop.get(L); if(t!=null) results.scrollTop=t; }

    // Keyboard nav + compare toggle
    document.addEventListener('keydown', (e)=>{
      if(e.key==='/' && document.activeElement!==q){ e.preventDefault(); q.focus(); q.select(); return; }
      if(e.key==='Escape'){ if(q.value){ q.value=''; applyFilter(); } else { q.blur(); closeCmd(); } }
      if(e.key==='ArrowDown'){ e.preventDefault(); if(!filtered.length) return; selIndex=Math.min(filtered.length-1, (selIndex<0?0:selIndex)+1); showDetail(filtered[selIndex]); ensureVisible(selIndex); renderWindow(); }
      if(e.key==='ArrowUp'){ e.preventDefault(); if(!filtered.length) return; selIndex=Math.max(0, (selIndex<0?0:selIndex)-1); showDetail(filtered[selIndex]); ensureVisible(selIndex); renderWindow(); }
      if(e.key==='Enter' && document.activeElement!==q){ if(selIndex>=0){ showDetail(filtered[selIndex]); ensureVisible(selIndex); }}
      if(e.shiftKey && e.key==='Enter' && selIndex>=0){ toggleCompare(filtered[selIndex]); }
      if(e.key.toLowerCase()==='l') setMode('list');
      if(e.key.toLowerCase()==='m') setMode('map');
      if(e.key.toLowerCase()==='c') setMode('cards');
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openCmd(); }
      if(e.key===' ' && currentMode==='cards'){ e.preventDefault(); flipCard(); }
    });

    q.addEventListener('input', applyFilter);
    clearBtn.onclick = ()=>{ q.value=''; applyFilter(); };
    results.addEventListener('scroll', renderWindow);
    window.addEventListener('resize', renderWindow);

    (function(){ const s=LS.get('lastFilters',null); if(!s) return; fRisk.value=s.risk||''; fAudience.value=s.audience||''; fStatus.value=s.status||''; if(Array.isArray(s.cats)){ activeCats.clear(); s.cats.forEach(c=>activeCats.add(c)); } if(s.text) q.value=s.text; })();

    drawChips(); applyFilter();

    /* ===================== COMMAND PALETTE ===================== */
    const cmd = document.getElementById('cmd');
    const cmdInput = document.getElementById('cmdInput');
    const cmdList = document.getElementById('cmdList');
    function openCmd(){ cmd.classList.add('is-open'); cmdInput.value=''; redrawCmd(); setTimeout(()=>cmdInput.focus(), 0); }
    function closeCmd(){ cmd.classList.remove('is-open'); }
    cmd.addEventListener('click', (e)=>{ if(e.target===cmd) closeCmd(); });
    cmdInput.addEventListener('input', redrawCmd);
    cmdInput.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeCmd(); });
    function redrawCmd(){
      const qv=cmdInput.value.trim();
      const arr = master
        .map(x=>({x,score: Math.max(fuzzyScore(x.title,qv), fuzzyScore(x.term,qv))}))
        .filter(o=> o.score>.75 || !qv)
        .sort((a,b)=> b.score-a.score)
        .slice(0,50);
      cmdList.innerHTML = arr.map(o=>`<div class="cmd-item" data-id="${o.x.id}"><div class="text-base">${o.x.title}</div><div class="text-xs opacity-80">${o.x.category}</div></div>`).join('');
      cmdList.querySelectorAll('.cmd-item').forEach(el=> el.onclick=()=>{ const id=el.getAttribute('data-id'); const item=master.find(i=>i.id===id); setMode('list'); selectById(id, item); closeCmd(); });
    }
    function selectById(id, item){ const idx = filtered.findIndex(i=>i.id===id); if(idx>=0){ selIndex=idx; showDetail(filtered[idx]); ensureVisible(idx); renderWindow(); } else if(item){ selIndex = 0; filtered = [item, ...filtered]; buildFlat(); renderWindow(); showDetail(item); } }

    /* ===================== COMPARE ===================== */
    const compareSet = new Map();
    const openCompare = document.getElementById('openCompare');
    const clearCompare = document.getElementById('clearCompare');
    function toggleCompare(it){ if(compareSet.has(it.id)) compareSet.delete(it.id); else if(compareSet.size<3) compareSet.set(it.id, it); redrawTray(); }
    function redrawTray(){
      trayItems.innerHTML='';
      compareSet.forEach(v=>{ const s=document.createElement('span'); s.className='pill'; s.textContent=v.term; trayItems.appendChild(s); });
      tray.classList.toggle('hidden', compareSet.size===0);
    }
    openCompare.onclick = ()=>{
      if(compareSet.size<2) return;
      const arr=[...compareSet.values()];
      const html = `<div class="fixed inset-0 bg-black/75 z-50 grid place-items-center p-4">
        <div class="bg-[#103b73] border-2 border-white rounded-xl max-w-6xl w-full p-4 overflow-auto max-h-[90vh]">
          <div class="flex justify-between items-center mb-2"><h3 class="text-2xl sketch-font">Compare</h3>
            <button class="border border-white/60 rounded px-2 py-1" id="cmpClose">Close</button></div>
          <div class="grid md:grid-cols-${arr.length} gap-4">${arr.map(x=>
            `<div class="sketch-border rounded p-3">
              <div class="text-xl font-bold mb-1">${x.title}</div>
              <div class="text-sm opacity-80 mb-2">${x.category} • Risk: ${x.riskLevel} • ${x.status}</div>
              <div class="mb-3">${x.diagram||''}</div>
              <div class="mb-2"><span class="font-semibold">What:</span> ${x.explanation}</div>
              <div class="mb-2"><span class="font-semibold">Why it matters:</span> ${x.importance}</div>
              <div class="mb-2"><span class="font-semibold">Damage example:</span> ${x.damageExample}</div>
            </div>`).join('')}</div>
        </div></div>`;
      const wrap=document.createElement('div'); wrap.innerHTML=html; document.body.appendChild(wrap);
      wrap.querySelector('#cmpClose').onclick=()=>wrap.remove();
    }
    clearCompare.onclick = ()=>{ compareSet.clear(); redrawTray(); }

    /* ===================== MODES ===================== */
    let currentMode='list';
    const listMode = document.getElementById('listMode');
    const mapWrap = document.getElementById('mapWrap');
    const cardsWrap = document.getElementById('cardsWrap');
    const btnList = document.getElementById('modeList');
    const btnMap = document.getElementById('modeMap');
    const btnCards = document.getElementById('modeCards');
    const mList = document.getElementById('mList');
    const mMap = document.getElementById('mMap');
    const mCards = document.getElementById('mCards');

    function setMode(m){
      currentMode=m;
      listMode.style.display = (m==='list')?'block':'none';
      mapWrap.dataset.active = (m==='map');
      cardsWrap.dataset.active = (m==='cards');
      btnList.dataset.active = (m==='list'); btnMap.dataset.active=(m==='map'); btnCards.dataset.active=(m==='cards');
      if(m==='map') drawMap(); if(m==='cards') initCards();
    }
    btnList.onclick=()=>setMode('list'); btnMap.onclick=()=>setMode('map'); btnCards.onclick=()=>setMode('cards');
    mList.onclick=()=>setMode('list'); mMap.onclick=()=>setMode('map'); mCards.onclick=()=>setMode('cards');

    /* ===================== MAP (Canvas) ===================== */
    const mapCanvas = document.getElementById('mapCanvas');
    const legend = document.getElementById('legend');
    let view = {x:0,y:0, k:1};
    const CAT_COL = {}; const pal = ['#7ef6ff','#c6ff7e','#ffd37e','#ff7ef6','#7effb3','#ff8b7e','#b07eff','#7ea5ff'];
    categories.forEach((c,i)=> CAT_COL[c]=pal[i%pal.length]);
    function resizeCanvas(){ const r=mapCanvas.getBoundingClientRect(); mapCanvas.width=Math.floor(r.width*devicePixelRatio); mapCanvas.height=Math.floor(r.height*devicePixelRatio); }
    window.addEventListener('resize', ()=>{ if(currentMode==='map'){ resizeCanvas(); drawMap(true); }});
    let nodePos = null;
    function computePositions(){
      const nodes = filtered.length? filtered: master;
      const byCat = new Map(); nodes.forEach(n=>{ if(!byCat.has(n.category)) byCat.set(n.category,[]); byCat.get(n.category).push(n); });
      const res=[]; const R0=150, Rstep=160; let ring=0;
      [...byCat.entries()].forEach(([cat, arr])=>{
        const R=R0 + ring*Rstep; const cx=0, cy=0; const N=arr.length; const jitter=10;
        arr.forEach((n, j)=>{ const a = (j/N)*Math.PI*2; const x=cx+Math.cos(a)*R + (Math.random()*jitter-jitter/2); const y=cy+Math.sin(a)*R + (Math.random()*jitter-jitter/2); res.push({n, x, y, cat}); });
        ring++;
      });
      nodePos = res;
    }
    function drawMap(reuse=false){
      resizeCanvas(); const ctx=mapCanvas.getContext('2d'); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,mapCanvas.width,mapCanvas.height);
      if(!nodePos || !reuse) computePositions();
      const cx=mapCanvas.width/2, cy=mapCanvas.height/2; ctx.translate(cx+view.x, cy+view.y); ctx.scale(view.k, view.k);
      ctx.lineWidth=1/devicePixelRatio;
      const cats = new Set(nodePos.map(p=>p.cat));
      cats.forEach(cat=>{
        ctx.beginPath(); ctx.strokeStyle = CAT_COL[cat]+'55';
        const pts = nodePos.filter(p=>p.cat===cat);
        let R = 0; if(pts.length){ R = Math.hypot(pts[0].x, pts[0].y); }
        ctx.arc(0,0,R,0,Math.PI*2); ctx.stroke();
      });
      nodePos.forEach(p=>{
        const r = 6 + (p.n.riskLevel==='High'?2:0);
        ctx.beginPath(); ctx.fillStyle = CAT_COL[p.cat]; ctx.strokeStyle = '#fff';
        ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fill(); ctx.stroke();
      });
      if(view.k>0.8){
        ctx.font = `${12/view.k}px 'Architects Daughter'`; ctx.fillStyle = '#fff'; ctx.textAlign='left';
        nodePos.forEach(p=>{ ctx.fillText(p.n.term, p.x+8, p.y+4); });
      }
      legend.innerHTML = categories.map(c=>`<span class="lg"><span class="sw" style="background:${CAT_COL[c]}"></span>${c}</span>`).join('');
    }
    (function(){
      let dragging=false, lx=0, ly=0;
      mapCanvas.addEventListener('mousedown', e=>{ dragging=true; lx=e.clientX; ly=e.clientY; });
      window.addEventListener('mouseup', ()=> dragging=false);
      window.addEventListener('mousemove', e=>{ if(!dragging) return; view.x += (e.clientX-lx); view.y += (e.clientY-ly); lx=e.clientX; ly=e.clientY; drawMap(true); });
      mapCanvas.addEventListener('wheel', e=>{ e.preventDefault(); const k = Math.exp(-e.deltaY/400); view.k *= k; view.k=Math.max(.4, Math.min(3,view.k)); drawMap(true); }, {passive:false});
      mapCanvas.addEventListener('click', e=>{
        const rect=mapCanvas.getBoundingClientRect(); const x=(e.clientX-rect.left)*devicePixelRatio, y=(e.clientY-rect.top)*devicePixelRatio;
        const cx=mapCanvas.width/2, cy=mapCanvas.height/2; const dx=(x-cx-view.x)/view.k, dy=(y-cy-view.y)/view.k;
        const hit = nodePos.find(p=> (dx-p.x)**2 + (dy-p.y)**2 < (10)**2 );
        if(hit){ setMode('list'); const id=hit.n.id; selectById(id, hit.n); }
      });
    })();

    /* ===================== CARDS ===================== */
    const cardFace = document.getElementById('cardFace');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnFlip = document.getElementById('btnFlip');
    const progressTxt = document.getElementById('progressTxt');
    const heat = document.getElementById('heat');

    let deck=[], idx=0, flipped=false;
    function initCards(){ deck = (filtered.length? filtered: master).slice();
      deck.sort((a,b)=> a.title.localeCompare(b.title));
      idx=0; flipped=false; renderCard(); renderHeat(); }
    function renderCard(){ if(!deck.length){ cardFace.textContent='No cards'; return; }
      const it=deck[idx]; const front = `<div class="sketch-font text-3xl mb-2">${it.title}</div><div class="text-base opacity-85">${it.category}</div>`;
      const back = `<div class="text-left max-w-[70ch] mx-auto">
        <div class="mb-2"><span class="font-semibold">What:</span> ${it.explanation}</div>
        <div class="mb-2"><span class="font-semibold">Why it matters:</span> ${it.importance}</div>
        <div class="mb-2"><span class="font-semibold">Damage example:</span> ${it.damageExample}</div>
      </div>`;
      cardFace.innerHTML = flipped? back : front; progressTxt.textContent = `${idx+1} / ${deck.length}`;
    }
    function flipCard(){ flipped=!flipped; renderCard(); }
    btnFlip.onclick=flipCard; btnPrev.onclick=()=>{ if(idx>0){ idx--; flipped=false; renderCard(); }}; btnNext.onclick=()=>{ if(idx<deck.length-1){ idx++; flipped=false; renderCard(); }};

    document.querySelectorAll('.rate').forEach(b=> b.onclick=()=>{ const v=+b.dataset.v||3; const key=`rate:${deck[idx].id}`; LS.set(key, {v, t:Date.now()}); renderHeat(); });
    function renderHeat(){
      const days=84; const today=new Date(); today.setHours(0,0,0,0);
      heat.innerHTML='';
      for(let i=days-1;i>=0;i--){ const d=new Date(today); d.setDate(today.getDate()-i); const k='review:'+d.toISOString().slice(0,10); const count=LS.get(k,0); const c=count? Math.min(4,count):0; const shades=['#0e2b57','#1b3f76','#2b5aa4','#3d77d2','#5a9bff'];
        const cell=document.createElement('div'); cell.style.height='10px'; cell.title=d.toDateString()+` — ${count} reviews`; cell.style.background=shades[c]; heat.appendChild(cell);
      }
      const todayKey='review:'+today.toISOString().slice(0,10); const cur=LS.get(todayKey,0); LS.set(todayKey, cur);
    }

    /* ===================== SAVED VIEWS ===================== */
    const saveView = document.getElementById('saveView');
    const views = document.getElementById('views');
    function loadViews(){ const all=LS.get('views',{}); views.innerHTML='<option value="">Load saved view…</option>' + Object.keys(all).map(k=>`<option>${k}</option>`).join(''); }
    saveView.onclick=()=>{
      const name=prompt('Name this view:'); if(!name) return;
      const state={ cats:[...activeCats], risk:fRisk.value, audience:fAudience.value, status:fStatus.value, q:q.value };
      const all=LS.get('views',{}); all[name]=state; LS.set('views',all); loadViews(); alert('Saved.');
    };
    views.onchange=()=>{
      const name=views.value; if(!name) return; const all=LS.get('views',{}); const s=all[name]; if(!s) return;
      activeCats.clear(); s.cats.forEach(c=>activeCats.add(c)); fRisk.value=s.risk||''; fAudience.value=s.audience||''; fStatus.value=s.status||''; q.value=s.q||''; drawChips(); applyFilter();
    };
    loadViews();
  </script>

  <noscript>
    <style>.splash{display:none}.content{opacity:1;transform:none}</style>
  </noscript>
</body>
</html>

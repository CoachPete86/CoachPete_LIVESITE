<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cybersecurity Blueprints – Splash → App</title>

  <!-- Fonts & Tailwind -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Architects+Daughter&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Preload splash image (HTTPS) -->
  <link rel="preload" as="image" href="https://coachpete86.github.io/that-bird/image/bird.png" />

  <style>
    :root{
      --splash-duration: 5s;    /* total time */
      --edge-glow: 8px;         /* perceived edge thickness of the glow */
    }

    html,body{height:100%;margin:0}
    body{ background:#000; font-family:'Kalam', cursive; overflow:hidden; }

    /* ========= SPLASH ========= */
    .splash{
      position:fixed; inset:0; z-index:9999; background:#000;
      display:grid; place-items:center;
      animation: splashFadeOut 1s ease forwards; animation-delay: var(--splash-duration);
    }
    @keyframes splashFadeOut{ to{ opacity:0; visibility:hidden } }

    .logo-wrap{ position:relative; width:min(78vmin,520px); }

    /* Base logo (static image) */
    .logo{
      width:100%; height:auto; display:block; position:relative; z-index:2;
      filter: drop-shadow(0 0 10px #000);
      /* 2 inhale–exhale cycles in 5s total */
      animation: pulse 2.5s ease-in-out 2;
    }
    @keyframes pulse{
      0%,100%{ transform:scale(1) }
      50%{ transform:scale(1.08) }
    }

    /* EDGE-ONLY NEON SHIMMER (simulated clockwise sweep without spinning the logo) */
    .neon {
      position:absolute; inset:0; pointer-events:none; z-index:3;
      /* use the PNG as the visible layer to drive edge shadows */
      background: url('https://coachpete86.github.io/that-bird/image/bird.png') center / contain no-repeat;
      /* multi-directional drop-shadows that shift clockwise across time */
      filter:
        drop-shadow(0 calc(-1 * var(--edge-glow)) var(--edge-glow) #ff004c)
        drop-shadow(var(--edge-glow) 0 var(--edge-glow) #ff4df3)
        drop-shadow(0 var(--edge-glow) var(--edge-glow) #3f5bff)
        drop-shadow(calc(-1 * var(--edge-glow)) 0 var(--edge-glow) #00ff8a);
      animation: glowSweep 2.5s linear 2; /* 2 sweeps total */
    }
    /* The sequence brightens each side in turn → top → right → bottom → left (clockwise) */
    @keyframes glowSweep {
      0% {
        filter:
          drop-shadow(0 calc(-1 * var(--edge-glow)) var(--edge-glow) #ff004c)
          drop-shadow(var(--edge-glow) 0 var(--edge-glow) #ff4df3)
          drop-shadow(0 var(--edge-glow) var(--edge-glow) #3f5bff)
          drop-shadow(calc(-1 * var(--edge-glow)) 0 var(--edge-glow) #00ff8a);
      }
      25% {
        filter:
          drop-shadow(0 calc(-1 * var(--edge-glow)) var(--edge-glow) #ff4df3)
          drop-shadow(var(--edge-glow) 0 var(--edge-glow) #3f5bff)
          drop-shadow(0 var(--edge-glow) var(--edge-glow) #00ff8a)
          drop-shadow(calc(-1 * var(--edge-glow)) 0 var(--edge-glow) #ffee00);
      }
      50% {
        filter:
          drop-shadow(0 calc(-1 * var(--edge-glow)) var(--edge-glow) #3f5bff)
          drop-shadow(var(--edge-glow) 0 var(--edge-glow) #00ff8a)
          drop-shadow(0 var(--edge-glow) var(--edge-glow) #ffee00)
          drop-shadow(calc(-1 * var(--edge-glow)) 0 var(--edge-glow) #ff004c);
      }
      75% {
        filter:
          drop-shadow(0 calc(-1 * var(--edge-glow)) var(--edge-glow) #00ff8a)
          drop-shadow(var(--edge-glow) 0 var(--edge-glow) #ffee00)
          drop-shadow(0 var(--edge-glow) var(--edge-glow) #ff004c)
          drop-shadow(calc(-1 * var(--edge-glow)) 0 var(--edge-glow) #ff4df3);
      }
      100% {
        filter:
          drop-shadow(0 calc(-1 * var(--edge-glow)) var(--edge-glow) #ff004c)
          drop-shadow(var(--edge-glow) 0 var(--edge-glow) #ff4df3)
          drop-shadow(0 var(--edge-glow) var(--edge-glow) #3f5bff)
          drop-shadow(calc(-1 * var(--edge-glow)) 0 var(--edge-glow) #00ff8a);
      }
    }

    /* Loading bar */
    .load{ margin-top:22px; width:min(60vmin,360px); height:8px; background:#111; border-radius:999px; overflow:hidden; box-shadow:0 0 0 1px #ffffff22 inset; }
    .fill{
      width:0%; height:100%;
      background:linear-gradient(90deg, #ff004c, #ff7b00, #ffee00, #00ff9e, #00e4ff, #3f5bff, #ff4df3, #ff004c);
      animation: fill var(--splash-duration) linear forwards;
      box-shadow: 0 0 12px #18ffff;
    }
    @keyframes fill{ to{ width:100% } }

    /* ========= APP (BLUEPRINT) ========= */
    body.blueprint{ overflow:auto; background-color:#1a3a6a; color:#fff;
      background-image:
        linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size:2rem 2rem;
    }
    .content{ opacity:0; transform:translateY(8px); transition: opacity .6s ease .2s, transform .6s ease .2s; }
    .content.is-live{ opacity:1; transform:none; }

    /* UI styles scoped to .blueprint */
    body.blueprint .sketch-border{ border:2px solid rgba(255,255,255,.8); box-shadow:2px 2px 0 rgba(255,255,255,.5); transition:all .2s ease-in-out; }
    body.blueprint .sketch-border:hover{ transform:translate(-2px,-2px); box-shadow:4px 4px 0 rgba(255,255,255,.5); }
    body.blueprint .sketch-font{ font-family:'Architects Daughter', cursive; }
    body.blueprint .modal{ transition:opacity .25s ease; }
    body.blueprint .modal-content{ transition:transform .25s ease; }
    body.blueprint ::-webkit-scrollbar{ width:8px; }
    body.blueprint ::-webkit-scrollbar-track{ background:#1a3a6a; }
    body.blueprint ::-webkit-scrollbar-thumb{ background:#ffffff; border-radius:4px; }
    body.blueprint .diagram-text{ font-family:'Architects Daughter', cursive; font-size:10px; fill:white; text-anchor:middle; }
    body.blueprint .category-title{ font-family:'Architects Daughter', cursive; border-bottom:2px solid rgba(255,255,255,.5); padding-bottom:.5rem; }
    body.blueprint .section-title{ font-family:'Architects Daughter', cursive; font-weight:700; color:#a7f3d0; }

    /* Reduced motion: skip animations but still show app */
    @media (prefers-reduced-motion: reduce){
      .logo{ animation:none }
      .neon{ animation:none }
      .splash{ animation-delay:.01s }
      .fill{ animation-duration:.01s }
    }
  </style>
</head>
<body>
  <!-- ===== SPLASH ===== -->
  <div class="splash" aria-hidden="true">
    <div class="logo-wrap">
      <img class="logo" alt="App emblem" src="https://coachpete86.github.io/that-bird/image/bird.png" />
      <div class="neon"></div>
    </div>
    <div class="load" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div>
  </div>

  <!-- ===== APP ===== -->
  <main class="content" id="app" role="main">
    <div class="container mx-auto p-4 md:p-8">

      <!-- Header -->
      <header class="text-center mb-8 md:mb-12">
        <h1 class="text-4xl md:text-6xl font-bold text-white sketch-font">Cybersecurity Blueprints</h1>
        <p class="text-lg md:text-xl text-gray-300 mt-2">Simple explanations for complex tech.</p>
      </header>

      <!-- Search -->
      <div class="mb-8 md:mb-12 max-w-2xl mx-auto">
        <input type="text" id="searchInput" class="w-full bg-transparent text-white placeholder-gray-400 p-4 rounded-lg sketch-border text-xl focus:outline-none focus:ring-2 focus:ring-white" placeholder="Search all blueprints...">
      </div>

      <!-- Glossary -->
      <div id="glossaryContainer"></div>
    </div>

    <!-- Modal -->
    <div id="termModal" class="modal fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-70 p-4 opacity-0 pointer-events-none">
      <div id="modalContent" class="modal-content bg-[#1a3a6a] border-4 border-white rounded-lg p-6 md:p-8 max-w-3xl w-full relative transform scale-95 overflow-y-auto max-h-full">
        <button id="closeModal" class="absolute top-4 right-4 text-white text-4xl hover:text-gray-300 z-10" aria-label="Close">&times;</button>
        <h2 id="modalTitle" class="text-3xl md:text-4xl font-bold mb-4 sketch-font"></h2>
        <div id="modalDiagram" class="mb-6 text-center text-white"></div>
        <p id="modalExplanation" class="text-lg md:text-xl"></p>
        <div id="modalImportance" class="mt-6"></div>
        <div id="modalDamage" class="mt-6"></div>
      </div>
    </div>
  </main>

  <script>
    // Reveal app after splash (hard cutoff)
    setTimeout(() => {
      document.body.classList.add('blueprint');
      document.getElementById('app').classList.add('is-live');
      document.body.style.overflow = 'auto';
    }, 5000);

    // Progressbar ARIA
    (function(){
      const bar = document.querySelector('.load'); const fill = document.querySelector('.fill');
      if(!bar) return; const started = performance.now(); const total = 5000;
      const tick = now => {
        const pct = Math.min(100, ((now - started)/total)*100);
        bar.setAttribute('aria-valuenow', pct.toFixed(0));
        if(pct<100) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    })();
  </script>

          diagram: `<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="30" y="15" class="diagram-text">ATTACKERS</text><text x="20" y="30" font-size="12">💻</text><text x="40" y="40" font-size="12">💻</text><text x="20" y="50" font-size="12">💻</text><text x="40" y="60" font-size="12">💻</text><path d="M55,30 L180,50 M55,40 L180,50 M55,50 L180,50 M55,60 L180,50" stroke="#ff6b6b" stroke-width="1" fill="none"/><text x="200" y="35" class="diagram-text">YOUR WEBSITE</text><text x="200" y="55" font-size="24">💥</text><text x="200" y="70" class="diagram-text">(Offline)</text></svg>`
        },
        {
          term: "Zero-Day",
          title: "Zero-Day Exploit",
          explanation: "A 'zero-day' is a security flaw that developers don't know about yet. An attack that uses this flaw is a 'zero-day exploit' because the developers have had zero days to create a patch to fix it. It's an attack on an unknown weakness.",
          importance: "This is scary because it's an attack no one is prepared for. Even if you are fully up-to-date, a zero-day can still get through because not even the good guys know the weakness exists yet.",
          damageExample: "A hacker discovers a zero-day flaw in popular accounting software. They use it to silently steal financial data from hundreds of SMEs before the software company even knows there's a problem.",
          diagram: `<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="75" y="15" class="diagram-text">SOFTWARE WALL</text><rect x="25" y="20" width="100" height="50" fill="none" stroke="white" stroke-width="1.5"/><path d="M 70 35 L 80 45" stroke="#ff6b6b" stroke-width="1.5" /><text x="75" y="45" font-size="12" fill="#ff6b6b">?</text><text x="75" y="65" class="diagram-text">Unknown Flaw</text><text x="175" y="15" class="diagram-text">ATTACKER</text><text x="175" y="30" font-size="16">😈</text><line x1="160" y1="35" x2="80" y2="40" stroke="#ff6b6b" stroke-width="1.5"/><text x="125" y="50" class="diagram-text">No Patch Yet!</text></svg>`

          importance: "This undermines the trust you have in your internet connection. Using public Wi-Fi at a café could expose your passwords and private messages to a snooper without you ever knowing.",
          damageExample: "An employee working at a coffee shop connects to a fake Wi-Fi hotspot set up by an attacker. The attacker captures the login credentials for the company's private server, gaining full access to corporate data.",
          diagram: `<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="30" y="25" class="diagram-text">YOU</text><text x="30" y="45" font-size="16">🧑</text><text x="220" y="25" class="diagram-text">WEBSITE</text><text x="220" y="45" font-size="16">🌐</text><path d="M 50 45 C 125 20, 200 45, 200 45" stroke="white" stroke-width="1" fill="none" stroke-dasharray="3 3"/><text x="125" y="55" class="diagram-text">HACKER IN MIDDLE</text><text x="125" y="40" font-size="16">😈</text><text x="125" y="25" font-size="12">👁️</text></svg>`

      "Web & Network Security": [
        {

          diagram: `<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="30" y="25" class="diagram-text">You ask for:</text><text x="30" y="45" font-size="10">google.com</text><line x1="60" y1="42" x2="90" y2="42" stroke="white" stroke-width="1.5"/><polyline points="85,37 90,42 85,47" stroke="white" stroke-width="1.5" fill="none" /><text x="125" y="15" class="diagram-text">DNS PHONEBOOK</text><text x="125" y="45" font-size="20">📖</text><line x1="160" y1="42" x2="190" y2="42" stroke="white" stroke-width="1.5"/><polyline points="185,37 190,42 185,47" stroke="white" stroke-width="1.5" fill="none" /><text x="220" y="25" class="diagram-text">It gives back:</text><text x="220" y="45" font-size="10">172.217.x.x</text></svg>`

        {

          importance: "It's the difference between sending a postcard and sending a sealed letter. Without the 'S', anyone who intercepts your data can read it. HTTPS ensures that only you and the website can understand the conversation.",
          damageExample: "An SME's online store doesn't use HTTPS on its checkout page. A customer enters their credit card details, which are transmitted in plain text. A hacker intercepts this data and uses the card for fraudulent purchases.",

      "Data Security": [

          term: "Data Breach",
          title: "Data Breach",
          explanation: "A data breach is when sensitive, private information is stolen from a system without the owner's permission. This happens when a hacker breaks through security defenses to access and copy the data.",
          importance: "This is the end result of a failed defense. A breach of your data can lead to identity theft, financial fraud, and strangers getting access to your most personal information.",

        {

    /* ===================== APP LOGIC ===================== */
    const container = document.getElementById('glossaryContainer');
    const searchInput = document.getElementById('searchInput');
    const modal = document.getElementById('termModal');
    const modalContent = document.getElementById('modalContent');
    const closeModalBtn = document.getElementById('closeModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalDiagram = document.getElementById('modalDiagram');
    const modalExplanation = document.getElementById('modalExplanation');
    const modalImportance = document.getElementById('modalImportance');
    const modalDamage = document.getElementById('modalDamage');

    function renderGlossary(filter = '') {
      container.innerHTML = '';
      const lowerCaseFilter = filter.toLowerCase();
      let foundResults = false;

      for (const category in glossaryData) {
        const terms = glossaryData[category];
        const filteredTerms = terms.filter(item =>
          item.title.toLowerCase().includes(lowerCaseFilter) || item.term.toLowerCase().includes(lowerCaseFilter)
        );

        if (filteredTerms.length > 0) {
          foundResults = true;
          const categoryTitle = document.createElement('h2');
          categoryTitle.className = 'text-3xl md:text-4xl font-bold text-white mb-6 mt-8 category-title';
          categoryTitle.textContent = category;
          container.appendChild(categoryTitle);

          const grid = document.createElement('div');
          grid.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 md:gap-8';

          filteredTerms.forEach(item => {
            const card = document.createElement('div');
            card.className = 'bg-transparent p-6 rounded-lg cursor-pointer sketch-border';
            card.innerHTML = `<h3 class="text-2xl font-bold text-white sketch-font">${item.title}</h3>`;
            card.addEventListener('click', () => openModal(item));
            grid.appendChild(card);
          });

          container.appendChild(grid);
        }
      }
      if (!foundResults) {
        container.innerHTML = `<p class="text-white text-center col-span-full text-xl mt-8">No blueprints found for "${filter}".</p>`;
      }
    }

    function openModal(item) {
      modalTitle.textContent = item.title;
      modalDiagram.innerHTML = item.diagram || '';
      modalExplanation.textContent = item.explanation;

      modalImportance.innerHTML = `<h3 class="text-2xl section-title mb-2">How This Affects You</h3><p class="text-lg md:text-xl">${item.importance}</p>`;
      modalDamage.innerHTML = `<h3 class="text-2xl section-title mb-2 mt-4">Damage Example</h3><p class="text-lg md:text-xl">${item.damageExample}</p>`;

      modal.classList.remove('opacity-0', 'pointer-events-none');
      modalContent.classList.remove('scale-95');
    }

    function closeModal() {
      modal.classList.add('opacity-0', 'pointer-events-none');
      modalContent.classList.add('scale-95');
    }

    searchInput.addEventListener('input', (e) => {
      renderGlossary(e.target.value);
    });

    closeModalBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    // Render after splash reveal
    const boot = () => {
      if (document.body.classList.contains('blueprint')) {
        renderGlossary();
      } else {
        setTimeout(boot, 120);
      }
    };
    boot();
  </script>

  <noscript>
    <style>.splash{display:none}.content{opacity:1;transform:none}</style>
  </noscript>

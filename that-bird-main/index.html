<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cybersecurity Blueprints — Splash to App</title>

    <!-- Google Fonts: Inter for clean text, Architects Daughter for the sketch feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --splash-total: 4.5s; /* Total splash time */
            --trace-duration: 2.2s; /* Duration of one full neon trace */
            --delay-fade: 0.5s;
        }

        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        /* Initial state of the body (behind splash) */
        body {
            background-color: #0d1222;
            overflow: hidden; /* Lock scroll during splash */
        }

        /* Main App UI background after splash ends */
        body.is-live-app {
            background: radial-gradient(circle at 120% 120%, rgba(13, 18, 34, 0.4) 0%, rgba(13, 18, 34, 1) 50%),
                        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px) 0 0 / 40px 40px,
                        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px) 0 0 / 40px 40px;
            background-color: #0d1222;
            overflow: auto; /* Unlock scroll */
        }

        /* ===== SPLASH SCREEN ===== */
        .splash-container {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: grid;
            place-items: center;
            background: #000;
        }

        .logo-wrap {
            position: relative;
            width: min(72vmin, 540px);
            aspect-ratio: 1/1;
            display: grid;
            place-items: center;
        }

        .logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 14px #000);
            transform: scale(0.9);
            animation: breathe 2s ease-in-out infinite alternate;
        }

        /* The div that will create the tracing neon glow effect */
        .neon-trace {
            position: absolute;
            inset: 0;
            pointer-events: none;
            /* Using a combination of radial and linear gradients for the color */
            background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(255,255,255,0.2) 100%);
            /* Using box-shadows to create the glowing, colored lines */
            box-shadow:
                0 0 10px #ff6666, /* red glow */
                0 0 20px #ff6666,
                0 0 10px #ffcc66, /* orange glow */
                0 0 20px #ffcc66,
                0 0 10px #ffff66, /* yellow glow */
                0 0 20px #ffff66,
                0 0 10px #66ff66, /* green glow */
                0 0 20px #66ff66,
                0 0 10px #6666ff, /* blue glow */
                0 0 20px #6666ff,
                0 0 10px #cc66ff, /* purple glow */
                0 0 20px #cc66ff;
            
            animation: 
                neonTrace var(--trace-duration) linear var(--splash-total) forwards,
                colorCycle var(--trace-duration) linear infinite;

            /* Start hidden, fade in with animation */
            opacity: 0;
            transform: scale(0) rotate(0deg);
            animation: 
                revealNeon 0.5s ease-out 0.5s forwards, 
                neonTrace var(--trace-duration) linear calc(var(--splash-total) - 1.5s) forwards;
        }
        
        /* The thin, glowing progress bar */
        .load-bar {
            position: absolute;
            bottom: clamp(18px, 6vh, 64px);
            width: min(64vmin, 460px);
            height: 8px;
            border-radius: 999px;
            overflow: hidden;
            background: #0b0b0b;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1) inset, 0 0 12px rgba(0, 255, 255, 0.5);
        }

        .load-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00fff2, #36f3ff, #8a9eff);
            box-shadow: 0 0 12px #36f3ff;
            animation: loadBar var(--splash-total) linear forwards;
        }

        /* Main app content, initially hidden */
        .app-content {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s;
        }

        .app-content.is-live {
            opacity: 1;
            transform: none;
        }

        /* ===== UTILITY & UI STYLES ===== */
        .sketch-font { font-family: 'Architects Daughter', cursive }
        .grid-app {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 2rem;
        }
        @media (max-width: 1024px) {
            .grid-app { grid-template-columns: 1fr }
        }

        /* Custom scrollbar for webkit browsers */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        /* General element styles */
        .bg-card { background: rgba(255, 255, 255, 0.05); }
        .bg-card-hover:hover { background: rgba(255, 255, 255, 0.08); }

        .btn-base {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: background-color 0.2s, transform 0.2s;
            cursor: pointer;
        }
        .btn-primary {
            @apply bg-blue-600 hover:bg-blue-500 text-white font-semibold;
        }
        .btn-secondary {
            @apply border border-white/20 text-white/80 hover:bg-white/10;
        }
        .btn-active {
            @apply bg-white/20;
        }

        /* Animations */
        @keyframes breathe {
            0%, 100% { transform: scale(0.9); }
            50% { transform: scale(1.0); }
        }

        @keyframes loadBar { to { width: 100%; } }

        /* New splash screen animation keyframes */
        @keyframes revealNeon {
            0% { opacity: 0; transform: scale(0) rotate(0deg); }
            100% { opacity: 1; transform: scale(1) rotate(720deg); }
        }

        @keyframes neonTrace {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes colorCycle {
            0% { box-shadow: 0 0 10px #ff6666, 0 0 20px #ff6666; }
            16% { box-shadow: 0 0 10px #ffcc66, 0 0 20px #ffcc66; }
            32% { box-shadow: 0 0 10px #ffff66, 0 0 20px #ffff66; }
            48% { box-shadow: 0 0 10px #66ff66, 0 0 20px #66ff66; }
            64% { box-shadow: 0 0 10px #6666ff, 0 0 20px #6666ff; }
            80% { box-shadow: 0 0 10px #cc66ff, 0 0 20px #cc66ff; }
            100% { box-shadow: 0 0 10px #ff6666, 0 0 20px #ff6666; }
        }

        @media (prefers-reduced-motion: reduce) {
            .logo, .neon-trace, .load-fill { animation: none !important; }
        }

    </style>
</head>
<body class="antialiased text-white">

    <!-- ===== SPLASH SCREEN ===== -->
    <div class="splash-container" aria-hidden="true">
        <div class="logo-wrap">
            <!-- The inner div for the tracing effect -->
            <div class="neon-trace"></div>
            <!-- The main image that the neon effect traces around -->
            <img class="logo" alt="App emblem"
                 src="https://coachpete86.github.io/that-bird/image/bird.png" />
        </div>
        <div class="load-bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
            <div class="load-fill"></div>
        </div>
    </div>

    <!-- ===== MAIN APPLICATION UI ===== -->
    <main class="app-content min-h-screen py-8" id="app" role="main">
        <div class="container mx-auto px-4 md:px-8">
            <!-- Header & Mode Switcher -->
            <header class="mb-8 flex flex-wrap items-center justify-between gap-4">
                <div>
                    <h1 class="text-4xl md:text-6xl font-bold sketch-font text-cyan-200">Cybersecurity Blueprints</h1>
                    <p class="text-base md:text-lg text-gray-300">Fast and readable at scale.</p>
                </div>
                <nav class="flex gap-2" aria-label="Display mode">
                    <button id="modeList" class="btn-secondary rounded-full btn-active" title="List (L)">List</button>
                    <button id="modeMap" class="btn-secondary rounded-full" title="Map (M)">Map</button>
                    <button id="modeCards" class="btn-secondary rounded-full" title="Cards (C)">Cards</button>
                </nav>
            </header>

            <!-- Main Content Area -->
            <div class="grid-app">
                <!-- Left Column: Filters & Results List -->
                <aside class="space-y-4 lg:sticky lg:top-8 lg:self-start custom-scrollbar h-[calc(100vh-8rem)]">
                    <div class="bg-card rounded-xl p-4 shadow-xl">
                        <div class="flex items-center gap-2">
                            <input id="q" placeholder="Search ( / )" class="w-full bg-transparent text-white placeholder-gray-400 text-lg focus:outline-none" autocomplete="off" spellcheck="false" />
                            <button id="clearBtn" title="Clear" class="text-sm px-2 py-1 btn-secondary">Esc</button>
                        </div>
                        <div class="mt-2 text-sm text-gray-400 flex items-center justify-between">
                            <span id="metaCount">0 results</span>
                            <span class="hidden md:block">↑/↓ navigate • Enter open • Shift+Enter compare</span>
                        </div>
                    </div>

                    <!-- Category Chips & Filters -->
                    <div class="flex flex-wrap gap-2" id="chips"></div>
                    <div class="flex flex-wrap gap-2">
                        <select id="fRisk" class="bg-card btn-secondary rounded-lg">
                            <option value="">Risk: Any</option>
                            <option>Low</option><option>Medium</option><option>High</option>
                        </select>
                        <select id="fAudience" class="bg-card btn-secondary rounded-lg">
                            <option value="">Audience: Any</option>
                            <option>Owner</option><option>Staff</option><option>IT</option>
                        </select>
                        <select id="fStatus" class="bg-card btn-secondary rounded-lg">
                            <option value="">Status: Any</option>
                            <option>Core</option><option>Advanced</option>
                        </select>
                    </div>
                    <div class="az flex flex-wrap gap-1 text-sm" id="azBar" aria-label="Alphabet jump"></div>

                    <!-- Virtualized Results List -->
                    <div id="results" class="bg-card rounded-xl shadow-xl overflow-auto p-2 relative custom-scrollbar" role="listbox" aria-label="Results">
                        <div class="vr-inner" id="vrInner"></div>
                    </div>
                </aside>

                <!-- Right Column: Detail View -->
                <section id="detail" class="bg-card rounded-xl shadow-xl p-6 min-h-[60vh] custom-scrollbar" aria-live="polite">
                    <h2 id="dTitle" class="text-3xl md:text-4xl font-bold mb-2 text-cyan-200"></h2>
                    <div id="dMeta" class="text-sm text-gray-300 mb-4"></div>
                    <div id="dDiagram" class="my-6"></div>
                    <p id="dExpl" class="text-lg leading-relaxed text-gray-200"></p>
                    <div id="dImp" class="mt-6"></div>
                    <div id="dDmg" class="mt-6"></div>
                </section>
            </div>

            <!-- Compare Tray -->
            <div class="tray fixed bottom-4 left-1/2 -translate-x-1/2 bg-slate-900 border border-slate-700 rounded-2xl py-3 px-6 flex gap-4 items-center z-20 shadow-lg hidden" id="tray">
                <span class="text-sm opacity-80">Compare:</span>
                <div id="trayItems" class="flex gap-2"></div>
                <button id="openCompare" class="text-sm btn-secondary">Open</button>
                <button id="clearCompare" class="text-sm btn-secondary">Clear</button>
            </div>

            <!-- MAP MODE -->
            <section id="mapWrap" class="hidden">
                <canvas id="mapCanvas" class="rounded-xl shadow-xl border border-white/10"></canvas>
                <div class="legend flex flex-wrap gap-4 mt-4" id="legend"></div>
                <p class="text-sm text-gray-300 mt-2">Scroll to zoom • Drag to pan • Click a node to open</p>
            </section>

            <!-- CARDS MODE -->
            <section id="cardsWrap" class="hidden">
                <div class="card bg-card rounded-xl p-6 min-h-[30rem] shadow-xl w-full md:max-w-xl mx-auto">
                    <div class="face min-h-[16rem] grid place-items-center text-center p-4" id="cardFace">Loading…</div>
                    <div class="flex flex-wrap justify-center gap-2 mt-4">
                        <button id="btnPrev" class="btn-secondary">⟵ Prev</button>
                        <button id="btnFlip" class="btn-secondary">Flip (Space)</button>
                        <button id="btnNext" class="btn-secondary">Next ⟶</button>
                    </div>
                    <div class="flex flex-wrap justify-center items-center gap-2 mt-4 text-sm opacity-80">
                        <span>Rate recall:</span>
                        <button class="btn-secondary rate" data-v="1">1</button>
                        <button class="btn-secondary rate" data-v="2">2</button>
                        <button class="btn-secondary rate" data-v="3">3</button>
                        <button class="btn-secondary rate" data-v="4">4</button>
                        <button class="btn-secondary rate" data-v="5">5</button>
                    </div>
                    <div class="text-center text-sm text-gray-300 mt-2" id="progressTxt"></div>
                    <div class="mt-2 grid grid-cols-12 gap-1" id="heat"></div>
                </div>
            </section>
        </div>

        <!-- Mobile Display Switcher -->
        <div class="fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-700 md:hidden z-30">
            <div class="flex">
                <button id="mList" class="flex-1 py-4 text-sm btn-active">List</button>
                <button id="mMap" class="flex-1 py-4 text-sm">Map</button>
                <button id="mCards" class="flex-1 py-4 text-sm">Cards</button>
            </div>
        </div>

        <!-- Command Palette -->
        <div class="cmd fixed inset-0 bg-black/75 z-50 grid place-items-start pt-24 hidden" id="cmd">
            <div class="cmd-panel bg-slate-900 border border-slate-700 rounded-xl shadow-xl mx-auto w-11/12 md:max-w-2xl overflow-hidden">
                <input id="cmdInput" placeholder="Type to search..." class="w-full p-4 bg-slate-800 text-white placeholder-gray-400 focus:outline-none" autocomplete="off" spellcheck="false" />
                <div class="cmd-list max-h-[60vh] overflow-y-auto" id="cmdList"></div>
            </div>
        </div>
    </main>

    <!-- Fallback for browsers with JavaScript disabled -->
    <noscript>
        <style>.splash-container { display: none; } .app-content { opacity: 1; transform: none; } body { overflow: auto; }</style>
    </noscript>

    <script>
        /* ===================== SPLASH SCREEN LOGIC ===================== */
        const splashContainer = document.querySelector('.splash-container');
        const appContent = document.getElementById('app');
        const totalSplashTime = 4500; // Match CSS variable

        setTimeout(() => {
            splashContainer.style.transition = 'opacity 0.6s ease';
            splashContainer.style.opacity = '0';
            setTimeout(() => {
                splashContainer.remove();
                document.body.classList.add('is-live-app');
                appContent.classList.add('is-live');
            }, 600);
        }, totalSplashTime);

        // Progress bar ARIA updates
        (function() {
            const loadBar = document.querySelector('.load-bar');
            const startTime = performance.now();
            
            const updateProgress = (now) => {
                const progress = Math.min(100, ((now - startTime) / totalSplashTime) * 100);
                loadBar.setAttribute('aria-valuenow', Math.round(progress));
                if (progress < 100) {
                    requestAnimationFrame(updateProgress);
                }
            };
            requestAnimationFrame(updateProgress);
        })();


        /* ===================== DATASET (sample; extend freely) ===================== */
        // (This dataset remains the same as it was well-structured)

            { term:"Antivirus", title:"Antivirus Software", explanation:"Antivirus is like a doctor for your computer. It regularly scans for known sicknesses (viruses and malware) and removes them to keep your computer healthy. It also tries to stop new sicknesses from getting in.", importance:"It's your digital immune system. It cleans up infections you might pick up from browsing the web or opening a bad email, preventing them from causing real damage.", damageExample:"An employee downloads a seemingly harmless file that contains a virus. Without antivirus to detect it, the virus spreads across the company's network, slowing all computers to a crawl and making work impossible.", diagram:`<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="125" y="15" class="diagram-text">ANTIVIRUS SHIELD</text><path d="M 125, 20 C 60,20 60,70 125,70 C 190,70 190,20 125,20" stroke="white" stroke-width="2" fill="none"/><text x="125" y="50" font-size="20">🛡️</text><text x="50" y="35" class="diagram-text">File</text><text x="50" y="50" font-size="12">📄</text><text x="200" y="35" class="diagram-text">Virus</text><text x="200" y="50" font-size="12">🦠</text><line x1="190" y1="50" x2="140" y2="50" stroke="#ff6b6b" stroke-width="1.5"/><text x="145" y="45" font-size="12" fill="#ff6b6b">❌</text><line x1="60" y1="50" x2="110" y2="50" stroke="#4ade80" stroke-width="1.5"/></svg>`, tags:["endpoint"], riskLevel:"Medium", audience:["Staff","IT"], status:"Core" },
            { term:"Sandbox", title:"Sandbox", explanation:"A sandbox is like a secure playpen for computer programs. If you have a new or untrusted program, you can run it in the sandbox first. If it's malicious, it can't escape the playpen to harm your actual computer.", importance:"It lets you be curious without being careless. You can test out that cool-looking free program without risking your personal photos, documents, and passwords if it turns out to be malicious.", damageExample:"A small design firm runs a new, free photo editing tool in a sandbox and discovers it's ransomware. Because it was sandboxed, their actual client files were never touched. Without it, their entire portfolio would have been locked.", diagram:`<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="50" y="15" class="diagram-text">MAIN COMPUTER</text><rect x="10" y="20" width="80" height="50" rx="5" stroke="white" fill="none" stroke-width="1.5"/><text x="175" y="15" class="diagram-text">SANDBOX (Safe Area)</text><rect x="125" y="20" width="100" height="50" rx="5" stroke="white" fill="none" stroke-width="1.5" stroke-dasharray="4 2"/><text x="175" y="45" font-size="16">😈</text><text x="175" y="60" class="diagram-text">Untrusted App</text><path d="M 175,40 Q 140 30, 110 40" stroke="#ff6b6b" stroke-width="1" fill="none"/><text x="120" y="35" font-size="12" fill="#ff6b6b">❌</text><text x="125" y="45" class="diagram-text" fill="#ff6b6b">CAN'T ESCAPE</text></svg>`, tags:["analysis"], riskLevel:"Low", audience:["IT"], status:"Advanced" },

          ],
          "Types of Attacks": [
            { term:"Malware", title:"Malware (Malicious Software)", explanation:"Malware is like a tiny gremlin you accidentally let into your house (computer). It can do all sorts of bad things without you knowing, like breaking your toys (files), spying on you, or leaving the back door open for other gremlins.", importance:"This is the 'what' that all other defenses are trying to stop. Getting malware on your machine can lead to identity theft, financial loss, or simply losing access to your precious memories and files.", damageExample:"You receive malware that includes a keylogger. For weeks, it secretly records everything you type, including your online banking password. The attacker then logs in and drains your bank account.", diagram:`<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="125" y="15" class="diagram-text">YOUR COMPUTER</text><rect x="50" y="20" width="150" height="50" rx="5" stroke="white" fill="none" stroke-width="1.5"/><text x="125" y="45" font-size="24" fill="#ff6b6b">😈</text><text x="125" y="60" class="diagram-text">MALWARE</text><text x="80" y="35" class="diagram-text">Shreds Files</text><text x="80" y="50" font-size="12">📄✂️</text><text x="170" y="35" class="diagram-text">Steals Keys</text><text x="170" y="50" font-size="12">🔑➡️</text></svg>`, tags:["gremlin"], riskLevel:"High", audience:["Staff","Owner"], status:"Core" },
            { term:"Phishing", title:"Phishing", explanation:"Phishing is like a trickster sending you a fake invitation to a party. The invitation looks real and asks for your secret password to get in. But it's a trap to steal your password. They're 'fishing' for your private information.", importance:"It tricks you into giving away the keys to your digital life. A successful phishing attack can give a criminal access to your email, social media, or bank account by making you hand over the password yourself.", damageExample:"An SME's accountant receives a phishing email that looks like it's from the CEO, asking for an urgent wire transfer. The accountant, tricked by the convincing email, sends thousands of pounds to the attacker's account.", diagram:`<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="210" y="15" class="diagram-text">HACKER</text><text x="210" y="30" font-size="16">🎣</text><path d="M200,30 C 120 0, 80 20, 50 50" stroke="white" stroke-width="1" fill="none"/><text x="50" y="40" class="diagram-text">Fake Email/Site</text><text x="50" y="60" font-size="12">✉️</text><text x="15" y="60" class="diagram-text">YOU</text><text x="15" y="75" font-size="16">🧑</text><text x="100" y="70" class="diagram-text">Stealing Password</text><text x="80" y="60" font-size="12">🔑</text><path d="M30,70 C 40 65, 70 65, 80 60" stroke="#ff6b6b" stroke-width="1" fill="none" stroke-dasharray="2 2"/></svg>`, tags:["email"], riskLevel:"High", audience:["Staff","Owner"], status:"Core" },
            { term:"Ransomware", title:"Ransomware", explanation:"This is a type of malware that locks up all your files and holds them hostage. The attacker then demands money (a ransom) to give you the key to unlock your files. It's like a digital kidnapping of your data.", importance:"This can be devastating. Imagine every single one of your documents and photos being locked away, with a criminal demanding money to get them back. For many, this means losing irreplaceable files forever.", damageExample:"A small medical practice gets hit by ransomware. All their patient records are encrypted. They can't access schedules or histories, forcing them to shut down and face a choice: pay a huge ransom or risk going out of business.", diagram:`<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="50" y="25" class="diagram-text">Your Files</text><text x="50" y="45" font-size="12">📄</text><text x="50" y="60" font-size="12">🔐</text><text x="50" y="70" class="diagram-text">(Locked)</text><text x="175" y="15" class="diagram-text">ATTACKER DEMANDS RANSOM</text><text x="175" y="45" font-size="20">💰</text><line x1="70" y1="50" x2="160" y2="45" stroke="#ff6b6b" stroke-width="1.5"/><text x="175" y="65" class="diagram-text">For The Key 🔑</text></svg>`, tags:["crypto"], riskLevel:"High", audience:["IT","Owner"], status:"Core" },
            { term:"Spyware", title:"Spyware", explanation:"Spyware is sneaky malware that hides on your computer and secretly watches everything you do. It can record your keystrokes, see your screen, and steal your personal information, then send it all to a hacker.", importance:"It's a total invasion of your privacy. Spyware can watch you through your webcam, listen through your microphone, and read your private messages, turning your personal device into a spy tool against you.", damageExample:"A competitor installs spyware on an employee's laptop at an SME. They steal confidential product designs and client lists, giving the competitor an unfair advantage and costing the SME future business.", diagram:`<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="75" y="15" class="diagram-text">YOUR COMPUTER</text><rect x="25" y="20" width="100" height="50" rx="5" stroke="white" fill="none" stroke-width="1.5"/><text x="75" y="50" font-size="20">👁️</text><text x="75" y="65" class="diagram-text">Spyware</text><text x="200" y="15" class="diagram-text">HACKER</text><text x="200" y="30" font-size="16">😈</text><line x1="125" y1="45" x2="185" y2="30" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="2 2"/><text x="155" y="45" font-size="10">🔑...abc</text></svg>`, tags:["surveillance"], riskLevel:"Medium", audience:["Staff"], status:"Advanced" },
            { term:"Trojan", title:"Trojan Horse", explanation:"A Trojan is malware disguised as a legitimate program. Like the mythical Trojan Horse, you willingly bring it into your computer thinking it's a gift (like a free game), but it secretly contains malicious code that attacks from the inside.", importance:"It exploits your trust. You think you're getting something useful or fun, but you're actually inviting a thief into your home. It's dangerous because the initial infection is something you do willingly.", damageExample:"An employee at a small firm downloads a 'free PDF converter' that is actually a Trojan. Once installed, the Trojan opens a 'backdoor', allowing an attacker to access the company's server and steal all their financial records.", diagram:`<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="50" y="25" class="diagram-text">"Free Game"</text><text x="50" y="50" font-size="24">🎁</text><text x="55" y="50" font-size="12" fill="#ff6b6b">😈</text><line x1="80" y1="45" x2="150" y2="45" stroke="white" stroke-width="1.5"/><polyline points="145,40 150,45 145,50" stroke="white" stroke-width="1.5" fill="none" /><text x="190" y="30" class="diagram-text">YOUR COMPUTER</text><rect x="165" y="35" width="50" height="30" rx="5" stroke="white" fill="none" stroke-width="1.5"/></svg>`, tags:["deception"], riskLevel:"Medium", audience:["Staff"], status:"Core" },
            { term:"DDoS", title:"DDoS Attack", explanation:"Imagine a hundred people all trying to rush through a single doorway at the same time. The doorway gets completely jammed. A DDoS attack is similar: it floods a website with so much fake traffic that real users can't get through.", importance:"While it doesn't usually steal your data, it can completely block you from accessing essential online services. If your bank or work portal is hit, it's effectively 'off' for you and everyone else.", damageExample:"An e-commerce SME is about to launch a huge Black Friday sale. A rival launches a DDoS attack against their website. The site goes down, and they lose out on tens of thousands of pounds in sales.", diagram:`<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="30" y="15" class="diagram-text">ATTACKERS</text><text x="20" y="30" font-size="12">💻</text><text x="40" y="40" font-size="12">💻</text><text x="20" y="50" font-size="12">💻</text><text x="40" y="60" font-size="12">💻</text><path d="M55,30 L180,50 M55,40 L180,50 M55,50 L180,50 M55,60 L180,50" stroke="#ff6b6b" stroke-width="1" fill="none"/><text x="200" y="35" class="diagram-text">YOUR WEBSITE</text><text x="200" y="55" font-size="24">💥</text><text x="200" y="70" class="diagram-text">(Offline)</text></svg>`, tags:["traffic"], riskLevel:"Medium", audience:["Owner","IT"], status:"Advanced" },
            { term:"Zero-Day", title:"Zero-Day Exploit", explanation:"A 'zero-day' is a security flaw that developers don't know about yet. An attack that uses this flaw is a 'zero-day exploit' because the developers have had zero days to create a patch to fix it. It's an attack on an unknown weakness.", importance:"This is scary because it's an attack no one is prepared for. Even if you are fully up-to-date, a zero-day can still get through because not even the good guys know the weakness exists yet.", damageExample:"A hacker discovers a zero-day flaw in popular accounting software. They use it to silently steal financial data from hundreds of SMEs before the software company even knows there's a problem.", diagram:`<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="75" y="15" class="diagram-text">SOFTWARE WALL</text><rect x="25" y="20" width="100" height="50" fill="none" stroke="white" stroke-width="1.5"/><path d="M 70 35 L 80 45" stroke="#ff6b6b" stroke-width="1.5" /><text x="75" y="45" font-size="12" fill="#ff6b6b">?</text><text x="75" y="65" class="diagram-text">Unknown Flaw</text><text x="175" y="15" class="diagram-text">ATTACKER</text><text x="175" y="30" font-size="16">😈</text><line x1="160" y1="35" x2="80" y2="40" stroke="#ff6b6b" stroke-width="1.5"/><text x="125" y="50" class="diagram-text">No Patch Yet!</text></svg>`, tags:["vuln"], riskLevel:"High", audience:["IT"], status:"Advanced" },
            { term:"MitM", title:"Man-in-the-Middle Attack", explanation:"This is like a spy secretly sitting between you and the person you're talking to. The spy intercepts, reads, and can even change the messages being sent back and forth, and neither of you knows they are there.", importance:"This undermines the trust you have in your internet connection. Using public Wi-Fi at a café could expose your passwords and private messages to a snooper without you ever knowing.", damageExample:"An employee working at a coffee shop connects to a fake Wi-Fi hotspot set up by an attacker. The attacker captures the login credentials for the company's private server, gaining full access to corporate data.", diagram:`<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="30" y="25" class="diagram-text">YOU</text><text x="30" y="45" font-size="16">🧑</text><text x="220" y="25" class="diagram-text">WEBSITE</text><text x="220" y="45" font-size="16">🌐</text><path d="M 50 45 C 125 20, 200 45, 200 45" stroke="white" stroke-width="1" fill="none" stroke-dasharray="3 3"/><text x="125" y="55" class="diagram-text">HACKER IN MIDDLE</text><text x="125" y="40" font-size="16">😈</text><text x="125" y="25" font-size="12">👁️</text></svg>`, tags:["wifi"], riskLevel:"Medium", audience:["Staff"], status:"Advanced" }
          ],
          "Web & Network Security": [
            { term:"VPN", title:"VPN (Virtual Private Network)", explanation:"Imagine the internet is a busy public road. A VPN is like building your own private, secret tunnel underneath that road. Only you can use this tunnel, so no one on the main road can see where you're going. It keeps your internet travel private.", importance:"It gives you privacy and security, especially on public Wi-Fi. It stops the network owner (and any hackers on it) from seeing which websites you visit or what data you're sending.", damageExample:"Without a VPN, an employee sends a confidential business proposal over a hotel's public Wi-Fi. A competitor on the same network intercepts the unencrypted data and steals the proposal, causing the SME to lose a major contract.", diagram:`<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="30" y="15" class="diagram-text">YOU</text><path d="M20,20 h20 v20 h-20 z M20,40 l20,10 v-30 l-20,10" stroke="white" fill="none" stroke-width="1"/><text x="220" y="15" class="diagram-text">WEBSITE</text><rect x="200" y="20" width="40" height="20" rx="5" stroke="white" fill="none" stroke-width="1"/><line x1="210" y1="25" x2="230" y2="25" stroke="white" stroke-width="1"/><line x1="210" y1="30" x2="230" y2="30" stroke="white" stroke-width="1"/><text x="125" y="10" class="diagram-text">PUBLIC INTERNET (Visible)</text><path d="M 45 30 Q 125 0, 200 30" stroke="white" stroke-width="1" fill="none" stroke-dasharray="3 3"/><text x="125" y="30" font-size="12" fill="white">👁️</text><text x="125" y="75" class="diagram-text">VPN TUNNEL (Private)</text><path d="M 45 40 Q 125 80, 200 40" stroke="#4ade80" stroke-width="3" fill="none"/></svg>`, tags:["privacy"], riskLevel:"Medium", audience:["Staff"], status:"Core" },
            { term:"Cookies", title:"Cookies (HTTP)", explanation:"Cookies are like little name tags that websites give you. When you visit a site, it gives you a cookie. The next time you come back, the website reads your 'name tag' to remember who you are, what you like, or what you had in your shopping cart.", importance:"While mostly harmless, they are a record of your browsing activity. 'Tracking cookies' can be used to build a very detailed profile of your habits and interests, which can feel like an invasion of privacy.", damageExample:"An employee's browser is hijacked, allowing an attacker to steal their session cookies for the company's internal portal. The attacker uses these cookies to bypass the login screen and gain access as the employee, without needing a password.", diagram:`<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="50" y="15" class="diagram-text">1. First Visit</text><text x="20" y="40" font-size="16">🧑</text><text x="80" y="40" font-size="16">🌐</text><text x="50" y="43" font-size="12" fill="#4ade80">➡️🍪</text><text x="50" y="60" class="diagram-text">Site gives you a cookie</text><text x="180" y="15" class="diagram-text">2. Return Visit</text><text x="150" y="40" font-size="16">🧑🍪</text><text x="210" y="40" font-size="16">🌐</text><text x="180" y="43" font-size="12" fill="#4ade80">⬅️</text><text x="180" y="60" class="diagram-text">Site remembers you!</text></svg>`, tags:["web"], riskLevel:"Low", audience:["Staff"], status:"Advanced" },
            { term:"DNS", title:"DNS (Domain Name System)", explanation:"DNS is the phonebook of the internet. When you type a website name (like google.com), your computer asks DNS to look up its real address (an IP address like 172.217.169.46), just like looking up a friend's number to call them.", importance:"If an attacker can control your DNS, they can redirect you to fake websites. You might type in your bank's correct address, but end up on a perfect copy designed to steal your login details.", damageExample:"An attacker uses DNS poisoning to redirect an SME's website traffic to a malicious server. Customers trying to visit the shop are instead met with a ransomware download, damaging the company's reputation.", diagram:`<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="30" y="25" class="diagram-text">You ask for:</text><text x="30" y="45" font-size="10">google.com</text><line x1="60" y1="42" x2="90" y2="42" stroke="white" stroke-width="1.5"/><polyline points="85,37 90,42 85,47" stroke="white" stroke-width="1.5" fill="none" /><text x="125" y="15" class="diagram-text">DNS PHONEBOOK</text><text x="125" y="45" font-size="20">📖</text><line x1="160" y1="42" x2="190" y2="42" stroke="white" stroke-width="1.5"/><polyline points="185,37 190,42 185,47" stroke="white" stroke-width="1.5" fill="none" /><text x="220" y="25" class="diagram-text">It gives back:</text><text x="220" y="45" font-size="10">172.217.x.x</text></svg>`, tags:["internet"], riskLevel:"Medium", audience:["IT"], status:"Core" },
            { term:"HTTPS", title:"HTTPS", explanation:"HTTPS is the secure version of the standard web protocol (HTTP). The 'S' stands for 'Secure' and means the connection between your browser and the website is encrypted and safe. Look for the padlock icon!", importance:"It's the difference between sending a postcard and sending a sealed letter. Without the 'S', anyone who intercepts your data can read it. HTTPS ensures that only you and the website can understand the conversation.", damageExample:"An SME's online store doesn't use HTTPS on its checkout page. A customer enters their credit card details, which are transmitted in plain text. A hacker intercepts this data and uses the card for fraudulent purchases.", diagram:`<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="30" y="25" class="diagram-text">YOU</text><text x="30" y="45" font-size="16">🧑</text><text x="220" y="25" class="diagram-text">WEBSITE</text><text x="220" y="45" font-size="16">🌐</text><text x="125" y="15" class="diagram-text">SECURE CONNECTION</text><path d="M 50 45 C 125 80, 200 45, 200 45" stroke="#4ade80" stroke-width="3" fill="none"/><text x="125" y="40" font-size="12">🔒</text></svg>`, tags:["tls"], riskLevel:"High", audience:["IT"], status:"Core" },
            { term:"Proxy", title:"Proxy Server", explanation:"A proxy server acts as a middleman between you and the internet. Instead of connecting directly to a website, you connect to the proxy, and the proxy connects to the website for you. This can hide your location.", importance:"It can help protect your identity online by masking your real location (IP address). This makes it harder for websites and advertisers to track you across the internet.", damageExample:"An SME uses a malicious proxy server to manage their web traffic. The proxy owner logs all data passing through it, including employee logins and client communications, resulting in a massive data breach.", diagram:`<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="30" y="25" class="diagram-text">YOU</text><text x="30" y="45" font-size="16">🧑</text><line x1="45" y1="45" x2="100" y2="45" stroke="white" stroke-width="1.5"/><polyline points="95,40 100,45 95,50" stroke="white" stroke-width="1.5" fill="none" /><text x="125" y="15" class="diagram-text">PROXY SERVER</text><rect x="110" y="30" width="30" height="30" rx="5" stroke="white" fill="none" stroke-width="1.5"/><line x1="140" y1="45" x2="195" y2="45" stroke="white" stroke-width="1.5"/><polyline points="190,40 195,45 190,50" stroke="white" stroke-width="1.5" fill="none" /><text x="220" y="25" class="diagram-text">WEBSITE</text><text x="220" y="45" font-size="16">🌐</text></svg>`, tags:["routing"], riskLevel:"Low", audience:["IT"], status:"Advanced" }
          ],
          "Data Security": [
            { term:"Encryption", title:"Encryption", explanation:"Encryption is like writing a message in a secret code. Even if someone intercepts your message, they can't read it because it just looks like gibberish. Only the person with the secret key can decode it.", importance:"It's the ultimate safety net for your data. If your laptop is stolen, encryption ensures the thief gets a useless brick of scrambled data instead of your tax returns, family photos, and private documents.", damageExample:"A consultant loses a company laptop containing an unencrypted copy of an SME's entire client database. The thief sells the data—names, addresses, and purchase histories—to a competitor.", diagram:`<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="30" y="25" class="diagram-text">Readable Data</text><text x="30" y="45" font-size="12">📄</text><text x="30" y="48" font-size="8" fill="black">ABC</text><text x="80" y="48" font-size="12">🔒</text><line x1="45" y1="45" x2="70" y2="45" stroke="white" stroke-width="1.5"/><polyline points="65,40 70,45 65,50" stroke="white" stroke-width="1.5" fill="none" /><text x="125" y="25" class="diagram-text">Encrypted (Gibberish)</text><text x="125" y="45" font-size="12">📄</text><text x="125" y="48" font-size="8" fill="#ff6b6b">#@$</text><text x="180" y="48" font-size="12">🔑</text><line x1="140" y1="45" x2="170" y2="45" stroke="white" stroke-width="1.5"/><polyline points="165,40 170,45 165,50" stroke="white" stroke-width="1.5" fill="none" /><text x="220" y="25" class="diagram-text">Readable Again</text><text x="220" y="45" font-size="12">📄</text><text x="220" y="48" font-size="8" fill="black">ABC</text></svg>`, tags:["crypto"], riskLevel:"High", audience:["Owner","IT"], status:"Core" },
            { term:"Hashing", title:"Hashing", explanation:"Hashing turns a piece of data, like a password, into a unique, jumbled-up string of characters. It's a one-way trip; you can't turn the hash back into the original password. It's used to store passwords securely.", importance:"It protects your passwords even if a company gets hacked. If the company stored your password as a hash, the hackers get a useless string of text, not your actual password, so they can't use it on your other accounts.", damageExample:"A small forum website stores user passwords in plain text instead of hashing them. They suffer a data breach. An attacker now has the email and password for a user who reuses that same password for their online banking.", diagram:`<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="50" y="25" class="diagram-text">Password</text><text x="50" y="45" font-size="10">P@ssword1</text><text x="125" y="15" class="diagram-text">HASH FUNCTION</text><text x="125" y="45" font-size="20">⚙️</text><line x1="80" y1="45" x2="110" y2="45" stroke="white" stroke-width="1.5"/><polyline points="105,40 110,45 105,50" stroke="white" stroke-width="1.5" fill="none" /><text x="200" y="25" class="diagram-text">Secure Hash</text><text x="200" y="45" font-size="8">5e884898...</text><text x="125" y="65" class="diagram-text">(One-Way Only)</text></svg>`, tags:["crypto"], riskLevel:"Medium", audience:["IT"], status:"Advanced" },
            { term:"Data Breach", title:"Data Breach", explanation:"A data breach is when sensitive, private information is stolen from a system without the owner's permission. This happens when a hacker breaks through security defenses to access and copy the data.", importance:"This is the end result of a failed defense. A breach of your data can lead to identity theft, financial fraud, and strangers getting access to your most personal information.", damageExample:"An SME's cloud storage is poorly secured. A hacker gains access and downloads all their internal documents, including employee contracts with salary information. The leak causes internal chaos and tips off competitors.", diagram:`<svg class="w-full h-48" viewBox="0 0 250 80" preserveAspectRatio="xMidYMid meet"><text x="75" y="15" class="diagram-text">SECURE DATABASE</text><rect x="25" y="20" width="100" height="50" rx="5" stroke="white" fill="none" stroke-width="1.5"/><path d="M 70 30 L 80 50" stroke="#ff6b6b" stroke-width="3"/><text x="75" y="65" class="diagram-text">(CRACKED)</text><text x="175" y="15" class="diagram-text">HACKER</text><text x="175" y="30" font-size="16">😈</text><line x1="160" y1="35" x2="80" y2="40" stroke="#ff6b6b" stroke-width="1.5"/><text x="125" y="50" font-size="12">📄➡️</text></svg>`, tags:["incident"], riskLevel:"High", audience:["Owner","IT"], status:"Core" }
          ]
        };
        
        /* ===================== UTILITIES ===================== */
        const letters = Array.from({length: 26}, (_, i) => String.fromCharCode(65 + i));
        const categories = Object.keys(glossaryData);
        const SYN = new Map(Object.entries({
            "2fa": "Two-Factor Authentication", "mfa": "Two-Factor Authentication",
            "mitm": "Man-in-the-Middle Attack",
            "ssl": "HTTPS", "tls": "HTTPS",
            "vpn tunnel": "VPN (Virtual Private Network)"
        }));

        const normalize = (s) => (s || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
        const fuzzyScore = (text, query) => {
            if (!query) return 1;
            const t = normalize(text), q = normalize(query);
            if (!t || !q) return 0;
            if (t === q) return 1;
            if (t.startsWith(q)) return 0.95;
            if (t.includes(q)) return 0.85;
            const textArr = t.split(' '), queryArr = q.split(' ');
            let intersectionCount = 0;
            queryArr.forEach(word => { if (textArr.includes(word)) intersectionCount++; });
            return intersectionCount ? 0.7 + 0.05 * intersectionCount : 0;
        };

        const LS = {
            get: (key, def) => { try { const value = localStorage.getItem(key); return value ? JSON.parse(value) : def; } catch { return def; } },
            set: (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch { } }
        };

        /* ===================== BUILD MASTER LIST ===================== */
        const master = [];
        Object.entries(glossaryData).forEach(([category, items]) => {
            items.forEach(item => master.push({ id: `${category}:${item.term}`, category, ...item }));
        });

        /* ===================== LIST MODE (virtualized) ===================== */
        const elements = {
            q: document.getElementById('q'), clearBtn: document.getElementById('clearBtn'), chips: document.getElementById('chips'),
            results: document.getElementById('results'), inner: document.getElementById('vrInner'), metaCount: document.getElementById('metaCount'),
            azBar: document.getElementById('azBar'), dTitle: document.getElementById('dTitle'), dMeta: document.getElementById('dMeta'),
            dDiagram: document.getElementById('dDiagram'), dExpl: document.getElementById('dExpl'), dImp: document.getElementById('dImp'),
            dDmg: document.getElementById('dDmg'), fRisk: document.getElementById('fRisk'), fAudience: document.getElementById('fAudience'),
            fStatus: document.getElementById('fStatus'), tray: document.getElementById('tray'), trayItems: document.getElementById('trayItems'),
            listMode: document.getElementById('listMode'), mapWrap: document.getElementById('mapWrap'), cardsWrap: document.getElementById('cardsWrap'),
            modeButtons: document.querySelectorAll('.switch button'), mobileButtons: document.querySelectorAll('.mobile-switch button'),
            cmd: document.getElementById('cmd'), cmdInput: document.getElementById('cmdInput'), cmdList: document.getElementById('cmdList')
        };

        const activeCategories = new Set(categories);
        let filteredItems = [];
        let flatList = [], offsets = [], totalHeight = 0, letterTops = new Map();
        let selectedIndex = -1;

        const ROW_HEIGHT = 80, HEADER_HEIGHT = 32, RENDER_BUFFER = 300;

        const escapeRegExp = (str) => str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const highlightText = (text, query) => {
            if (!query) return text;
            const regex = new RegExp(`(${escapeRegExp(query)})`, 'ig');
            return text.replace(regex, '<mark class="bg-cyan-200 text-slate-900 rounded-sm px-1">$1</mark>');
        };

        const drawChips = () => {
            elements.chips.innerHTML = '';
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'btn-secondary rounded-full text-xs transition-colors';
                btn.textContent = cat;
                btn.dataset.active = activeCategories.has(cat);
                btn.onclick = () => {
                    activeCategories.has(cat) ? activeCategories.delete(cat) : activeCategories.add(cat);
                    btn.dataset.active = activeCategories.has(cat);
                    applyFilters();
                };
                elements.chips.appendChild(btn);
            });
            const tools = document.createElement('div');
            tools.className = 'flex gap-3 text-xs text-gray-400';
            tools.innerHTML = `<button class="underline" id="allOn">All</button><button class="underline" id="allOff">None</button>`;
            elements.chips.appendChild(tools);
            document.getElementById('allOn').onclick = () => { categories.forEach(c => activeCategories.add(c)); drawChips(); applyFilters(); };
            document.getElementById('allOff').onclick = () => { activeCategories.clear(); drawChips(); applyFilters(); };
        };

        letters.forEach(ch => {
            const btn = document.createElement('button');
            btn.className = 'btn-secondary hover:bg-white/10 w-8 h-8 rounded-md';
            btn.textContent = ch;
            btn.onclick = () => jumpToLetter(ch);
            elements.azBar.appendChild(btn);
        });

        const applyFilters = () => {
            const text = elements.q.value.trim();
            const queries = SYN.get(normalize(text)) ? [text, SYN.get(normalize(text))] : [text];
            const risk = elements.fRisk.value;
            const audience = elements.fAudience.value;
            const status = elements.fStatus.value;

            filteredItems = master.filter(item => {
                if (!activeCategories.has(item.category)) return false;
                if (risk && item.riskLevel !== risk) return false;
                if (status && item.status !== status) return false;
                if (audience && !(item.audience || []).includes(audience)) return false;
                if (!text) return true;
                const searchableText = [item.title, item.term, (item.tags || []).join(' ')].join(' ');
                return queries.some(q => fuzzyScore(searchableText, q) >= 0.75);
            }).sort((a, b) => a.title.localeCompare(b.title));

            elements.metaCount.textContent = `${filteredItems.length} result${filteredItems.length !== 1 ? 's' : ''}`;
            buildFlatList();
            selectedIndex = filteredItems.length > 0 ? 0 : -1;
            showDetail(filteredItems[0]);
            elements.results.scrollTop = 0;
            renderVisibleList();
            LS.set('lastFilters', { risk, audience, status, categories: [...activeCategories], text });
        };

        const buildFlatList = () => {
            flatList = []; offsets = []; letterTops.clear(); totalHeight = 0;
            let currentLetter = '';
            filteredItems.forEach((item, index) => {
                const firstLetter = (item.title || item.term || '').charAt(0).toUpperCase();
                if (firstLetter !== currentLetter) {
                    currentLetter = firstLetter;
                    flatList.push({ type: 'header', letter: firstLetter });
                    offsets.push(totalHeight);
                    letterTops.set(firstLetter, totalHeight);
                    totalHeight += HEADER_HEIGHT;
                }
                flatList.push({ type: 'item', item, itemIndex: index });
                offsets.push(totalHeight);
                totalHeight += ROW_HEIGHT;
            });
            elements.inner.style.height = `${totalHeight}px`;
        };

        const binarySearch = (arr, target) => {
            let low = 0, high = arr.length;
            while (low < high) {
                const mid = (low + high) >> 1;
                if (arr[mid] < target) {
                    low = mid + 1;
                } else {
                    high = mid;
                }
            }
            return low;
        };

        const renderVisibleList = () => {
            const scrollTop = elements.results.scrollTop;
            const viewportHeight = elements.results.clientHeight;
            const firstIndex = binarySearch(offsets, Math.max(0, scrollTop - RENDER_BUFFER));
            const lastIndex = binarySearch(offsets, scrollTop + viewportHeight + RENDER_BUFFER);
            
            elements.inner.innerHTML = '';
            for (let i = firstIndex; i < lastIndex; i++) {
                const y = offsets[i];
                const row = flatList[i];
                if (row.type === 'header') {
                    const headerEl = document.createElement('div');
                    headerEl.className = 'absolute left-0 right-0 py-1 px-4 text-sm font-bold text-cyan-200';
                    headerEl.style.transform = `translateY(${y}px)`;
                    headerEl.textContent = row.letter;
                    elements.inner.appendChild(headerEl);
                } else {
                    const item = row.item;
                    const itemEl = document.createElement('div');
                    itemEl.className = 'vr-row absolute left-0 right-0 p-4 rounded-xl cursor-pointer transition-colors hover:bg-white/10';
                    itemEl.style.transform = `translateY(${y}px)`;
                    itemEl.dataset.selected = row.itemIndex === selectedIndex;
                    itemEl.innerHTML = `
                        <div class="flex items-center justify-between gap-2">
                            <div>
                                <div class="text-xl font-medium">${highlightText(item.title, elements.q.value)}</div>
                                <div class="text-xs text-gray-400 opacity-80">${item.category} • Risk: ${item.riskLevel} • ${item.status}</div>
                            </div>
                            <button class="add-to-compare text-xs btn-secondary">Compare</button>
                        </div>
                    `;
                    itemEl.onclick = (e) => {
                        if (e.target.classList.contains('add-to-compare')) {
                            e.stopPropagation();
                            toggleCompare(item);
                        } else {
                            selectedIndex = row.itemIndex;
                            showDetail(item);
                            ensureVisible(selectedIndex);
                            renderVisibleList();
                        }
                    };
                    elements.inner.appendChild(itemEl);
                }
            }
        };

        const showDetail = (item) => {
            if (!item) {
                elements.dTitle.textContent = '';
                elements.dMeta.textContent = '';
                elements.dDiagram.innerHTML = '';
                elements.dExpl.textContent = 'Select a blueprint from the list to see details.';
                elements.dImp.innerHTML = '';
                elements.dDmg.innerHTML = '';
                return;
            }
            elements.dTitle.textContent = item.title;
            elements.dMeta.textContent = `${item.category} • Risk: ${item.riskLevel} • Audience: ${(item.audience || []).join(', ') || 'All'} • ${item.status}`;
            elements.dDiagram.innerHTML = item.diagram || '';
            elements.dExpl.textContent = item.explanation;
            elements.dImp.innerHTML = `<h3 class="text-lg md:text-xl font-bold text-teal-300 mb-2">How This Affects You</h3><p class="text-gray-200">${item.importance}</p>`;
            elements.dDmg.innerHTML = `<h3 class="text-lg md:text-xl font-bold text-teal-300 mb-2 mt-4">Damage Example</h3><p class="text-gray-200">${item.damageExample}</p>`;
            history.replaceState(null, '', `#${encodeURIComponent(item.term)}`);
        };
        
        const ensureVisible = (index) => {
            if (index < 0) return;
            const itemOffset = offsets[flatList.findIndex(row => row.type === 'item' && row.itemIndex === index)];
            const itemBottom = itemOffset + ROW_HEIGHT;
            const viewportTop = elements.results.scrollTop;
            const viewportBottom = viewportTop + elements.results.clientHeight;
            if (itemOffset < viewportTop) {
                elements.results.scrollTop = itemOffset;
            } else if (itemBottom > viewportBottom) {
                elements.results.scrollTop = itemBottom - elements.results.clientHeight;
            }
        };

        const jumpToLetter = (letter) => {
            const top = letterTops.get(letter);
            if (top != null) {
                elements.results.scrollTop = top;
            }
        };

        elements.q.addEventListener('input', applyFilters);
        elements.clearBtn.onclick = () => { elements.q.value = ''; applyFilters(); };
        elements.results.addEventListener('scroll', renderVisibleList);
        window.addEventListener('resize', () => { if (currentMode === 'list') renderVisibleList(); });

        /* ===================== KEYBOARD SHORTCUTS ===================== */
        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== elements.q) { e.preventDefault(); elements.q.focus(); elements.q.select(); return; }
            if (e.key === 'Escape') { if (elements.q.value) { elements.q.value = ''; applyFilters(); } else { elements.q.blur(); closeCmd(); } }
            if (e.key === 'ArrowDown') { e.preventDefault(); if (!filteredItems.length) return; selectedIndex = Math.min(filteredItems.length - 1, (selectedIndex < 0 ? 0 : selectedIndex) + 1); showDetail(filteredItems[selectedIndex]); ensureVisible(selectedIndex); renderVisibleList(); }
            if (e.key === 'ArrowUp') { e.preventDefault(); if (!filteredItems.length) return; selectedIndex = Math.max(0, (selectedIndex < 0 ? 0 : selectedIndex) - 1); showDetail(filteredItems[selectedIndex]); ensureVisible(selectedIndex); renderVisibleList(); }
            if (e.key === 'Enter' && document.activeElement !== elements.q) { if (selectedIndex >= 0) showDetail(filteredItems[selectedIndex]); }
            if (e.shiftKey && e.key === 'Enter' && selectedIndex >= 0) toggleCompare(filteredItems[selectedIndex]);
            if (e.key.toLowerCase() === 'l') setMode('list');
            if (e.key.toLowerCase() === 'm') setMode('map');
            if (e.key.toLowerCase() === 'c') setMode('cards');
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCmd(); }
            if (e.key === ' ' && currentMode === 'cards') { e.preventDefault(); flipCard(); }
        });

        /* ===================== COMMAND PALETTE ===================== */
        const openCmd = () => { elements.cmd.classList.remove('hidden'); elements.cmdInput.value = ''; redrawCmd(); setTimeout(() => elements.cmdInput.focus(), 0); };
        const closeCmd = () => { elements.cmd.classList.add('hidden'); };
        elements.cmd.addEventListener('click', (e) => { if (e.target === elements.cmd) closeCmd(); });
        elements.cmdInput.addEventListener('input', redrawCmd);
        elements.cmdInput.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCmd(); });

        const redrawCmd = () => {
            const query = elements.cmdInput.value.trim();
            const results = master.map(item => ({
                item,
                score: Math.max(fuzzyScore(item.title, query), fuzzyScore(item.term, query))
            })).filter(res => res.score > 0.75 || !query).sort((a, b) => b.score - a.score).slice(0, 50);

            elements.cmdList.innerHTML = results.map(res => `
                <div class="cmd-item p-4 border-t border-white/10 cursor-pointer hover:bg-white/5" data-id="${res.item.id}">
                    <div class="text-base">${res.item.title}</div>
                    <div class="text-xs text-gray-400">${res.item.category}</div>
                </div>
            `).join('');

            elements.cmdList.querySelectorAll('.cmd-item').forEach(el => {
                el.onclick = () => {
                    const id = el.getAttribute('data-id');
                    const item = master.find(i => i.id === id);
                    setMode('list');
                    selectById(id, item);
                    closeCmd();
                };
            });
        };

        const selectById = (id, item) => {
            const index = filteredItems.findIndex(i => i.id === id);
            if (index >= 0) {
                selectedIndex = index;
                showDetail(filteredItems[index]);
                ensureVisible(selectedIndex);
                renderVisibleList();
            } else if (item) {
                filteredItems.unshift(item); // Add the item to the top
                buildFlatList();
                selectedIndex = 0;
                showDetail(item);
                renderVisibleList();
            }
        };

        /* ===================== COMPARE TRAY ===================== */
        const compareSet = new Map();
        const toggleCompare = (item) => {
            if (compareSet.has(item.id)) {
                compareSet.delete(item.id);
            } else if (compareSet.size < 3) {
                compareSet.set(item.id, item);
            }
            redrawTray();
        };

        const redrawTray = () => {
            elements.trayItems.innerHTML = '';
            compareSet.forEach(item => {
                const pill = document.createElement('span');
                pill.className = 'bg-slate-700 text-white text-xs px-2 py-1 rounded-full';
                pill.textContent = item.term;
                elements.trayItems.appendChild(pill);
            });
            elements.tray.classList.toggle('hidden', compareSet.size === 0);
        };

        document.getElementById('openCompare').onclick = () => {
            if (compareSet.size < 2) return;
            const itemsToCompare = [...compareSet.values()];
            const html = `
                <div class="fixed inset-0 bg-black/75 z-50 overflow-y-auto grid place-items-center p-4">
                    <div class="bg-slate-900 border border-slate-700 rounded-xl shadow-2xl max-w-7xl w-full p-6 text-white max-h-[90vh]">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-2xl sketch-font">Compare Blueprints</h3>
                            <button id="cmpClose" class="btn-secondary">Close</button>
                        </div>
                        <div class="grid md:grid-cols-${itemsToCompare.length} gap-6">
                            ${itemsToCompare.map(item => `
                                <div class="bg-slate-800 rounded-lg p-4 shadow-inner">
                                    <div class="text-xl font-bold mb-1 text-cyan-200">${item.title}</div>
                                    <div class="text-xs opacity-80 mb-2 text-gray-400">${item.category} • Risk: ${item.riskLevel} • ${item.status}</div>
                                    <div class="mb-4">${item.diagram || ''}</div>
                                    <div class="mb-2"><span class="font-semibold text-teal-300">What:</span> ${item.explanation}</div>
                                    <div class="mb-2"><span class="font-semibold text-teal-300">Why it matters:</span> ${item.importance}</div>
                                    <div class="mb-2"><span class="font-semibold text-teal-300">Damage example:</span> ${item.damageExample}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            const wrapper = document.createElement('div');
            wrapper.innerHTML = html;
            document.body.appendChild(wrapper);
            wrapper.querySelector('#cmpClose').onclick = () => wrapper.remove();
        };

        document.getElementById('clearCompare').onclick = () => {
            compareSet.clear();
            redrawTray();
        };

        /* ===================== MODES & SWITCHING ===================== */
        let currentMode = 'list';
        const setMode = (mode) => {
            currentMode = mode;
            document.querySelectorAll('section[id$="Wrap"], section[id$="Mode"]').forEach(el => {
                el.style.display = 'none';
            });
            document.getElementById(`${mode}Wrap` || `${mode}Mode`).style.display = 'block';

            document.querySelectorAll('.btn-secondary').forEach(btn => btn.classList.remove('btn-active'));
            document.getElementById(`mode${mode.charAt(0).toUpperCase() + mode.slice(1)}`).classList.add('btn-active');
            document.getElementById(`m${mode.charAt(0).toUpperCase() + mode.slice(1)}`).classList.add('btn-active');
            
            if (mode === 'map') drawMap();
            if (mode === 'cards') initCards();
        };

        document.getElementById('modeList').onclick = () => setMode('list');
        document.getElementById('modeMap').onclick = () => setMode('map');
        document.getElementById('modeCards').onclick = () => setMode('cards');
        document.getElementById('mList').onclick = () => setMode('list');
        document.getElementById('mMap').onclick = () => setMode('map');
        document.getElementById('mCards').onclick = () => setMode('cards');

        /* ===================== MAP (Canvas) ===================== */
        const mapCanvas = document.getElementById('mapCanvas');
        const legendContainer = document.getElementById('legend');
        let view = { x: 0, y: 0, k: 1 };
        const CATEGORY_COLORS = {};
        const palette = ['#7ef6ff', '#c6ff7e', '#ffd37e', '#ff7ef6', '#7effb3', '#ff8b7e', '#b07eff', '#7ea5ff'];
        categories.forEach((cat, i) => CATEGORY_COLORS[cat] = palette[i % palette.length]);
        let nodePositions = null;

        const resizeCanvas = () => {
            const rect = mapCanvas.getBoundingClientRect();
            mapCanvas.width = Math.floor(rect.width * window.devicePixelRatio);
            mapCanvas.height = Math.floor(rect.height * window.devicePixelRatio);
        };

        const computePositions = () => {
            const nodes = filteredItems.length ? filteredItems : master;
            const itemsByCategory = new Map();
            nodes.forEach(n => {
                if (!itemsByCategory.has(n.category)) itemsByCategory.set(n.category, []);
                itemsByCategory.get(n.category).push(n);
            });

            const positions = [];
            let currentRingRadius = 150, ringIncrement = 160;
            [...itemsByCategory.entries()].forEach(([category, items]) => {
                const numItems = items.length;
                items.forEach((item, j) => {
                    const angle = (j / numItems) * Math.PI * 2;
                    const x = Math.cos(angle) * currentRingRadius + (Math.random() * 20 - 10);
                    const y = Math.sin(angle) * currentRingRadius + (Math.random() * 20 - 10);
                    positions.push({ item, x, y, category });
                });
                currentRingRadius += ringIncrement;
            });
            nodePositions = positions;
        };

        const drawMap = (reusePositions = false) => {
            resizeCanvas();
            const ctx = mapCanvas.getContext('2d');
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, mapCanvas.width, mapCanvas.height);

            if (!nodePositions || !reusePositions) computePositions();

            const centerX = mapCanvas.width / 2, centerY = mapCanvas.height / 2;
            ctx.translate(centerX + view.x, centerY + view.y);
            ctx.scale(view.k, view.k);
            ctx.lineWidth = 1 / window.devicePixelRatio;

            // Draw concentric rings for categories
            const categoriesOnMap = new Set(nodePositions.map(p => p.category));
            let ringRadius = 150, ringIncrement = 160;
            [...categoriesOnMap].forEach(() => {
                ctx.beginPath();
                ctx.strokeStyle = '#fff1';
                ctx.arc(0, 0, ringRadius, 0, Math.PI * 2);
                ctx.stroke();
                ringRadius += ringIncrement;
            });

            // Draw nodes and labels
            nodePositions.forEach(p => {
                const nodeSize = 6 + (p.item.riskLevel === 'High' ? 4 : 0);
                
                // Node border
                ctx.beginPath();
                ctx.fillStyle = CATEGORY_COLORS[p.category];
                ctx.strokeStyle = '#fff';
                ctx.arc(p.x, p.y, nodeSize, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Node label
                if (view.k > 0.8) {
                    ctx.font = `14px 'Inter', sans-serif`;
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'left';
                    ctx.fillText(p.item.term, p.x + nodeSize + 4, p.y + nodeSize / 2);
                }
            });

            // Draw connections between related nodes (simplified example)
            // (You can add logic here to draw lines between nodes that share a tag)

            // Update legend
            legendContainer.innerHTML = categories.map(cat => `
                <span class="flex items-center gap-2 text-sm text-gray-300">
                    <span class="w-3 h-3 rounded" style="background:${CATEGORY_COLORS[cat]}"></span>
                    ${cat}
                </span>
            `).join('');
        };

        // Map Interaction Handlers
        let isDragging = false, lastX = 0, lastY = 0;
        mapCanvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            view.x += (e.clientX - lastX);
            view.y += (e.clientY - lastY);
            lastX = e.clientX;
            lastY = e.clientY;
            drawMap(true);
        });
        mapCanvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const scaleFactor = Math.exp(-e.deltaY / 500);
            view.k *= scaleFactor;
            view.k = Math.max(0.4, Math.min(3, view.k));
            drawMap(true);
        }, { passive: false });
        mapCanvas.addEventListener('click', (e) => {
            const rect = mapCanvas.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) * window.devicePixelRatio;
            const clickY = (e.clientY - rect.top) * window.devicePixelRatio;
            const mapX = (clickX - mapCanvas.width / 2 - view.x) / view.k;
            const mapY = (clickY - mapCanvas.height / 2 - view.y) / view.k;
            const hitNode = nodePositions.find(p => (mapX - p.x) ** 2 + (mapY - p.y) ** 2 < (20) ** 2);
            if (hitNode) {
                setMode('list');
                selectById(hitNode.item.id, hitNode.item);
            }
        });

        /* ===================== CARDS MODE ===================== */
        const cardFace = document.getElementById('cardFace');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const btnFlip = document.getElementById('btnFlip');
        const progressTxt = document.getElementById('progressTxt');
        const heatMapContainer = document.getElementById('heat');

        let cardDeck = [], currentCardIndex = 0, isCardFlipped = false;
        const initCards = () => {
            cardDeck = (filteredItems.length ? filteredItems : master).slice();
            cardDeck.sort((a, b) => a.title.localeCompare(b.title));
            currentCardIndex = 0;
            isCardFlipped = false;
            renderCard();
            renderHeatMap();
        };

        const renderCard = () => {
            if (!cardDeck.length) {
                cardFace.innerHTML = '<div class="text-xl text-gray-400">No cards to display.</div>';
                return;
            }
            const currentItem = cardDeck[currentCardIndex];
            const frontContent = `
                <div class="sketch-font text-3xl mb-2 text-cyan-200">${currentItem.title}</div>
                <div class="text-base opacity-85 text-gray-300">${currentItem.category}</div>
            `;
            const backContent = `
                <div class="text-left max-w-[70ch] mx-auto space-y-4 text-gray-200">
                    <div><span class="font-semibold text-teal-300">What:</span> ${currentItem.explanation}</div>
                    <div><span class="font-semibold text-teal-300">Why it matters:</span> ${currentItem.importance}</div>
                    <div><span class="font-semibold text-teal-300">Damage example:</span> ${currentItem.damageExample}</div>
                </div>
            `;
            cardFace.innerHTML = isCardFlipped ? backContent : frontContent;
            progressTxt.textContent = `${currentCardIndex + 1} / ${cardDeck.length}`;
        };

        const flipCard = () => {
            isCardFlipped = !isCardFlipped;
            renderCard();
        };
        btnFlip.onclick = flipCard;
        btnPrev.onclick = () => { if (currentCardIndex > 0) { currentCardIndex--; isCardFlipped = false; renderCard(); } };
        btnNext.onclick = () => { if (currentCardIndex < cardDeck.length - 1) { currentCardIndex++; isCardFlipped = false; renderCard(); } };

        document.querySelectorAll('.rate').forEach(btn => {
            btn.onclick = () => {
                const ratingValue = +btn.dataset.v || 3;
                const cardId = cardDeck[currentCardIndex].id;
                const today = new Date().toISOString().slice(0, 10);
                const reviewKey = `review:${today}:${cardId}`;
                LS.set(reviewKey, { rating: ratingValue, timestamp: Date.now() });
                renderHeatMap();
            };
        });

        const renderHeatMap = () => {
            const numDays = 84;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            heatMapContainer.innerHTML = '';
            const shades = ['#1a2a46', '#2b4474', '#3d6199', '#5a82c4', '#7aa4f6'];

            for (let i = numDays - 1; i >= 0; i--) {
                const date = new Date(today);
                date.setDate(today.getDate() - i);
                let totalReviews = 0;
                cardDeck.forEach(item => {
                    const reviewKey = `review:${date.toISOString().slice(0, 10)}:${item.id}`;
                    if (LS.get(reviewKey)) {
                        totalReviews++;
                    }
                });
                const colorIndex = Math.min(shades.length - 1, totalReviews);
                const cell = document.createElement('div');
                cell.style.height = '10px';
                cell.style.background = shades[colorIndex];
                cell.title = `${date.toDateString()} - ${totalReviews} reviews`;
                cell.className = 'rounded';
                heatMapContainer.appendChild(cell);
            }
        };

        /* ===================== INITIALIZATION ===================== */
        (function () {
            const savedFilters = LS.get('lastFilters', null);
            if (savedFilters) {
                elements.fRisk.value = savedFilters.risk || '';
                elements.fAudience.value = savedFilters.audience || '';
                elements.fStatus.value = savedFilters.status || '';
                if (Array.isArray(savedFilters.categories)) {
                    activeCategories.clear();
                    savedFilters.categories.forEach(c => activeCategories.add(c));
                }
                elements.q.value = savedFilters.text || '';
            }
            drawChips();
            applyFilters();
        })();

    </script>
</body>
</html>

<canvas id="fx"></canvas>
<script>
// Canvas sparks that follow the SVG path
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d', {alpha:true});
function size(){canvas.width=innerWidth; canvas.height=innerHeight;}
addEventListener('resize', size); size();

const neon = ['#00FFFF','#FF00FF','#00FF66','#FFD300','#FF4D00'];
let particles = [];

const svg = document.querySelector('svg');
const path = document.getElementById('logoPath');
const img = document.getElementById('logoImage');

// Fit SVG on screen center via its clientBox
function getMatrix() {
  const box = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const sx = box.width / vb.width;
  const sy = box.height / vb.height;
  const dx = box.left;
  const dy = box.top;
  return {sx, sy, dx, dy};
}

class Spark{ 
  constructor(x,y,vx,vy,life,c){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.life=life;this.max=life;this.c=c;}
  step(dt){ this.vy+=400*dt/1000; this.x+=this.vx*dt/1000; this.y+=this.vy*dt/1000; this.vx*=0.995; this.vy*=0.995; this.life-=dt; }
  draw(){ const a=Math.max(this.life/this.max,0); ctx.globalAlpha = Math.min(a*1.2,1);
    ctx.beginPath(); ctx.arc(this.x,this.y,1.2+2*(1-a),0,Math.PI*2);
    ctx.fillStyle=this.c; ctx.shadowColor=this.c; ctx.shadowBlur=18; ctx.fill();
    ctx.globalAlpha=1; ctx.shadowBlur=0; }
}

let t=0; let speed=0.22; // rounds per second
let last=performance.now();

function tick(now){
  const dt=Math.min(32, now-last); last=now;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const {sx,sy,dx,dy} = getMatrix();
  const L = path.getTotalLength();
  t += (dt/1000)*speed;
  if(t>1) t -= 1;

  const p = path.getPointAtLength(L*t);
  const p2 = path.getPointAtLength(L*(t+0.001)%1);
  const nx = (p2.x-p.x); const ny = (p2.y-p.y);
  const nlen = Math.hypot(nx,ny)||1; const ux = nx/nlen, uy = ny/nlen;

  // screen coords
  const sxp = dx + p.x*sx, syp = dy + p.y*sy;

  // emit sparks
  for(let i=0;i<12;i++){ 
    const spread=(Math.random()-0.5)*1.2;
    const spd=220+Math.random()*260;
    const vx = (ux*spd + (-uy)*spd*spread), vy = (uy*spd + (ux)*spd*spread*0.4);
    particles.push(new Spark(sxp, syp, vx, vy, 320+Math.random()*320, neon[(Math.random()*neon.length)|0]));
  }

  // torch glow
  ctx.beginPath(); ctx.arc(sxp, syp, 7, 0, Math.PI*2);
  ctx.fillStyle='#fff'; ctx.shadowColor='#0ff'; ctx.shadowBlur=30; ctx.fill();
  ctx.shadowBlur=0;

  // update and draw particles
  for(let j=particles.length-1;j>=0;j--){ const s=particles[j]; s.step(dt); s.draw(); if(s.life<=0) particles.splice(j,1);}
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
